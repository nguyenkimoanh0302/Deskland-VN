<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deskland · Đại dương</title>
<style>
  :root { --taskbar: 48px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a72d4; }
  body { font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #desktop { position: fixed; left: 0; top: 0; right: 0; bottom: var(--taskbar); }
  #panel, #taskbar, #desktop { display: none; }
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.preview #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(255,255,255,.88); box-shadow: 3px 6px 8px rgba(40,60,90,.28); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.75); }
  #nogl { position: fixed; inset: 0; display: none; place-items: center; color: #fff; font-size: 16px; }
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="desktop"></div>
<div id="taskbar"><div id="clock"></div></div>
<div id="nogl">Trình duyệt hiện tại không hỗ trợ WebGL2, không thể chạy hình nền.</div>

<script>
'use strict';

const CELL_W = 76, CELL_H = 100, GRID_X0 = 4, GRID_Y0 = 6, TASKBAR = 48;
const STEP = 5;
const MORPH_MS = 1800;

const QS = new URLSearchParams(location.search);
const WALL = QS.has('wallpaper');
const PREVIEW = QS.has('preview');
const P = {
  sigma: 72, warp: 40, edge: 10, cover: 0.3, flow: 1,
  boats: 2, yachts: 1, birds: 3,
  grain: 1, quality: 2, debug: false, snap: true, cap30: true, adaptive: 1,
};
const DEFAULTS = Object.assign({}, P);
const DISPLAY_KEYS = ['adaptive'];
const SLIDERS = [
  { key: 'sigma',  label: 'Kích thước cụm mây', min: 40, max: 200, step: 1,     act: 'field' },
  { key: 'cover',  label: 'Mây trên mặt biển',  min: 0,  max: 1,   step: 0.01 },
  { key: 'flow',   label: 'Tốc độ trôi',        min: 0,  max: 3,   step: 0.05 },
  { key: 'boats',  label: 'Thuyền buồm',        min: 0,  max: 6,   step: 1,    act: 'boats' },
  { key: 'yachts', label: 'Du thuyền',          min: 0,  max: 4,   step: 1,    act: 'yachts' },
  { key: 'birds',  label: 'Hải âu',             min: 0,  max: 8,   step: 1,    act: 'birds' },
];

let seed = (Math.random() * 1e6) | 0;
function hash2(x, y, k = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed + k, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, k = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, k), b = hash2(ix + 1, iy, k), c = hash2(ix, iy + 1, k), d = hash2(ix + 1, iy + 1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y, k = 0) {
  let a = 0.5, s = 0;
  for (let i = 0; i < 4; i++) { s += a * vnoise(x, y, k + i * 7); x = x * 2.03 + 17.1; y = y * 2.03 + 17.1; a *= 0.5; }
  return s;
}
function tileNoise(x, y, px, py, k) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const m = (v, p) => ((v % p) + p) % p;
  const x0 = m(ix, px), x1 = m(ix + 1, px), y0 = m(iy, py), y1 = m(iy + 1, py);
  const a = hash2(x0, y0, k), b = hash2(x1, y0, k), c = hash2(x0, y1, k), d = hash2(x1, y1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function tileFbm(u, v, periods, k) {
  let s = 0, w = 0.5, tw = 0;
  for (let i = 0; i < periods.length; i++) { s += w * tileNoise(u * periods[i], v * periods[i], periods[i], periods[i], k + i * 13); tw += w; w *= 0.5; }
  return s / tw;
}
function makeNoiseImage() {
  const S = 256, d = new Uint8Array(S * S * 4);
  const chans = [[8, 16, 32, 64], [8, 16, 32, 64], [8, 16, 32], [16, 32, 64, 128]];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S, i = (y * S + x) * 4;
    for (let c = 0; c < 4; c++) {
      let n = tileFbm(u, v, chans[c], 100 + c * 50);
      d[i + c] = Math.min(Math.max((n - 0.5) * 1.9 + 0.5, 0), 1) * 255;
    }
  }
  return { S, d };
}

let W = innerWidth, H = innerHeight, Gw = 1, Gh = 1, NZ = null;
function buildNoise() {
  const N = Gw * Gh;
  NZ = { wx: new Float32Array(N), wy: new Float32Array(N) };
  for (let gy = 0; gy < Gh; gy++) for (let gx = 0; gx < Gw; gx++) {
    const i = gy * Gw + gx, x = gx * STEP, y = gy * STEP;
    NZ.wx[i] = fbm(x * 0.0028, y * 0.0028, 1) - 0.47;
    NZ.wy[i] = fbm(x * 0.0028, y * 0.0028, 2) - 0.47;
  }
}
function computeField(rects) {
  const N = Gw * Gh, f1 = new Float32Array(N);
  const sig = P.sigma, is1 = 1 / (sig * sig);
  const wa = P.warp * 2.2, wmax = wa * 0.5;
  for (const r of rects) {
    const R = 5.5 * sig + Math.max(r.hw, r.hh) * 0.5 + wmax;
    const gx0 = Math.max(0, Math.floor((r.cx - R) / STEP)), gx1 = Math.min(Gw - 1, Math.ceil((r.cx + R) / STEP));
    const gy0 = Math.max(0, Math.floor((r.cy - R) / STEP)), gy1 = Math.min(Gh - 1, Math.ceil((r.cy + R) / STEP));
    const chw = r.hw * 0.5, chh = r.hh * 0.5;
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const i = gy * Gw + gx;
      const qx = gx * STEP + NZ.wx[i] * wa, qy = gy * STEP + NZ.wy[i] * wa;
      let dx = Math.abs(qx - r.cx) - chw, dy = Math.abs(qy - r.cy) - chh;
      if (dx < 0) dx = 0; if (dy < 0) dy = 0;
      f1[i] += Math.exp(-(dx * dx + dy * dy) * is1);
    }
  }
  const c0 = Math.sqrt(-Math.log(0.35)), s = new Float32Array(N), fMin = Math.exp(-30);
  for (let i = 0; i < N; i++) {
    const g = Math.log(Math.max(f1[i], fMin));
    s[i] = sig * (Math.sqrt(Math.max(-g, 0)) - c0) - sig * 0.6 * Math.max(g, 0);
  }
  return { s };
}
function sampleArr(a, x, y) {
  const fx = Math.min(Math.max(x / STEP, 0), Gw - 1.001), fy = Math.min(Math.max(y / STEP, 0), Gh - 1.001);
  const ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy, i = iy * Gw + ix;
  return (a[i] * (1 - tx) + a[i + 1] * tx) * (1 - ty) + (a[i + Gw] * (1 - tx) + a[i + Gw + 1] * tx) * ty;
}

const VS = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const FS = `#version 300 es
precision highp float;
uniform sampler2D uNoise, uFA, uFB;
uniform vec2 uRes, uGrid;
uniform float uScale, uSeed, uStep, uMix, uTime, uDebug, uEdge;
uniform highp sampler2D uCirc;
uniform vec2 uCGrid;
uniform float uCellG;
uniform float uBoatN;
uniform vec4 uBoat[6];       // x, y, huong, pha
uniform float uYachtN;
uniform vec4 uYacht[4];      // x, y, huong, pha
uniform float uBirdN;
uniform vec4 uBird[8];
out vec4 o;

const vec3 SEA_LIGHT = vec3(0.24, 0.56, 0.90), SEA_MID = vec3(0.16, 0.45, 0.83), SEA_DEEP = vec3(0.11, 0.36, 0.74);
const vec3 SHADOW = vec3(0.48, 0.58, 0.78);
const vec3 CLOUD_HI = vec3(1.0, 1.0, 1.0);
const vec3 CLOUD_BODY = vec3(0.89, 0.94, 0.98), CLOUD_SH = vec3(0.76, 0.84, 0.93);
const vec2 LIGHT = vec2(-0.6, -0.8);
const vec2 SHADOW_OFF = vec2(115.0, 156.0);
const int CIRC_K = 36;

float hash2(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float ss(float a, float b, float x) { float t = clamp((x - a) / (b - a), 0.0, 1.0); return t * t * (3.0 - 2.0 * t); }
vec4 N(vec2 p, float scale) { return texture(uNoise, p / scale + uSeed * 0.013); }
float fieldS(sampler2D t, vec2 p) { return texture(t, (p / uStep + 0.5) / uGrid).r; }
float smin(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }

float cloudDist(vec2 q, bool front, inout vec4 fc) {
  float sF = mix(fieldS(uFA, q), fieldS(uFB, q), uMix);
  float d = sF - uEdge + 0.6 * 95.0;
  ivec2 cell = ivec2(floor(q / uCellG)) + 4;
  if (cell.x < 0 || cell.y < 0 || float(cell.x) >= uCGrid.x || float(cell.y) >= uCGrid.y) return d;
  for (int k = 0; k < CIRC_K; k++) {
    vec4 c = texelFetch(uCirc, ivec2(cell.x * CIRC_K + k, cell.y), 0);
    if (c.z <= 0.0) break;
    float di = length(q - c.xy) - c.z;
    d = smin(d, di, 6.0);
    if (front && di < 0.0 && c.y > fc.y) fc = c;
  }
  return d;
}
float cloudDist(vec2 q) { vec4 fc = vec4(0.0, -1e9, 0.0, 0.0); return cloudDist(q, false, fc); }

// Thuyền buồm (nhìn từ trên xuống, x hướng về phía trước): thân thuyền + cánh buồm trắng căng gió
vec2 sailboatSD(vec2 q, float ph) {
  float L = 16.0, Wd = 4.6;
  float t = clamp(q.x / L, -1.0, 1.0);
  float w = Wd * (1.0 - t * t * 0.85);
  float hull = max(abs(q.y) - w, abs(q.x) - L);
  vec2 sq = q - vec2(1.5, 1.2 + sin(ph) * 0.4);
  float sail = (length(sq / vec2(9.5, 3.2)) - 1.0) * 3.2;
  return vec2(hull, sail);
}

// Du thuyền (nhìn từ trên xuống, x hướng về phía trước): thân thuôn + kính chắn gió xám đậm + sóng đuôi
float yachtHullSD(vec2 q) {
  float L = 21.0, Wd = 6.2;
  float t = clamp(q.x / L, -1.0, 1.0);
  float w = t > 0.0 ? Wd * (1.0 - t * t) : Wd * (0.82 + 0.18 * (1.0 + t));
  return max(abs(q.y) - w, abs(q.x) - L);
}

vec3 gullSD(vec2 q, float span) {
  float body = (length((q - vec2(0.8, 0.0)) / vec2(6.2, 1.9)) - 1.0) * 1.9;
  float tail = max(abs(q.y) - 1.4 - (-q.x - 4.0) * 0.25, max(-q.x - 8.5, q.x + 4.0));
  float y = abs(q.y), reach = 15.0 * span;
  float u = clamp((y - 1.0) / reach, 0.0, 1.0);
  float lead = 1.0 + 1.3 * sin(u * 3.14159) - 4.0 * u * u;
  float chord = mix(4.4, 1.3, u);
  float wing = max(max(q.x - lead, lead - chord - q.x), y - reach - 1.0);
  return vec3(min(body, tail), wing, u);
}

void main() {
  vec2 p = vec2(gl_FragCoord.x, uRes.y * uScale - gl_FragCoord.y) / uScale;
  float t = uTime;

  // ---------- Mặt biển: màu nước xanh lam đậm nhạt + ánh nước lấp lánh và hạt giấy ----------
  vec2 drift = vec2(t * 2.4, t * 0.9);
  float w1 = N(p + drift * 2.5, 1800.0).b, w2 = N(p - drift * 1.5 + 311.0, 620.0).g;
  vec3 col = mix(SEA_MID, SEA_LIGHT, ss(0.28, 0.74, w1 * 0.7 + w2 * 0.3));
  col = mix(col, SEA_DEEP, ss(0.45, 0.85, N(p + 977.0, 1300.0).r) * 0.42);
  col *= 1.0 + 0.05 * (0.5 - (p.x + p.y) / (uRes.x + uRes.y));

  // Gợn sóng nhỏ và đốm nắng lấp lánh trên mặt biển
  float waveTex = (N(p * vec2(1.0, 2.2) + drift * 5.0, 180.0).r - 0.5) * 0.04;
  col += waveTex;
  float glitter = ss(0.38, 0.75, N(p + drift * 3.0, 520.0).g);
  float spark = 0.0;
  for (int L = 0; L < 2; L++) {
    float fl = float(L), cs = L == 0 ? 25.0 : 39.0;
    mat2 R = rot(L == 0 ? 0.62 : -1.13);
    vec2 q = R * p / cs + fl * 17.3;
    vec2 cell = floor(q), f = fract(q);
    vec2 seedc = cell + fl * 51.7 + uSeed * 0.1;
    if (hash2(seedc) > (L == 0 ? 0.10 : 0.14) * glitter) continue;
    vec2 c = 0.15 + 0.7 * vec2(hash2(seedc + 1.3), hash2(seedc + 2.9));
    float life = fract(t * (0.3 + 0.35 * hash2(seedc + 8.1)) + hash2(seedc + 5.7));
    float tw = ss(0.0, 0.1, life) * (1.0 - ss(0.2, 0.45, life));
    float r = 0.7 + 0.9 * hash2(seedc + 3.3);
    spark = max(spark, (1.0 - ss(r * 0.5, r * 1.5, length((f - c) * cs))) * tw);
  }
  col = mix(col, vec3(0.92, 0.98, 1.0), spark * 0.75);
  col *= 1.0 + (hash2(floor(p * (0.8 * max(uScale, 1.0)))) - 0.5) * 0.032;

  // ---------- Thuyền buồm ----------
  for (int i = 0; i < 6; i++) {
    if (float(i) >= uBoatN) break;
    vec4 b = uBoat[i];
    vec2 d0 = p - b.xy;
    if (dot(d0, d0) > 1600.0) continue;
    vec2 q = rot(-b.z) * d0;
    // Vệt nước phía sau thuyền
    if (q.x < -8.0 && q.x > -38.0) {
      float wk = (1.0 - ss(-8.0, -38.0, q.x)) * (1.0 - ss(1.0, 6.0, abs(abs(q.y) - (-q.x - 8.0) * 0.22)));
      col = mix(col, vec3(0.85, 0.93, 0.99), wk * 0.45);
    }
    vec2 qs = rot(-b.z) * (d0 - vec2(6.0, 9.0));
    vec2 sds = sailboatSD(qs, b.w);
    col = mix(col, col * SHADOW, ss(1.4, -1.0, min(sds.x, sds.y)) * 0.65);
    vec2 sd = sailboatSD(q, b.w);
    if (sd.x < 0.8) {
      vec3 hullC = mix(vec3(0.95, 0.97, 0.99), vec3(0.76, 0.82, 0.89), ss(-3.0, 0.0, sd.x));
      col = mix(col, hullC, ss(0.6, -0.6, sd.x));
    }
    if (sd.y < 0.8) {
      vec3 sailC = mix(vec3(1.0, 1.0, 1.0), vec3(0.86, 0.91, 0.96), ss(-1.5, 1.5, q.y));
      col = mix(col, sailC, ss(0.6, -0.6, sd.y));
    }
  }

  // ---------- Du thuyền (kèm vệt sóng bọt trắng) ----------
  for (int i = 0; i < 4; i++) {
    if (float(i) >= uYachtN) break;
    vec4 y = uYacht[i];
    vec2 d0 = p - y.xy;
    if (dot(d0, d0) > 3600.0) continue;
    vec2 q = rot(-y.z) * d0;
    if (q.x < -14.0 && q.x > -56.0) {
      float distBack = -q.x - 14.0;
      float wakeW = 2.5 + distBack * 0.26;
      float edgeWake = 1.0 - ss(0.8, 3.2, abs(abs(q.y) - wakeW));
      float centerFoam = 1.0 - ss(0.0, wakeW * 0.85, abs(q.y));
      float fade = 1.0 - ss(0.0, 42.0, distBack);
      col = mix(col, vec3(0.94, 0.98, 1.0), max(edgeWake * 0.65, centerFoam * 0.42) * fade);
    }
    vec2 qs = rot(-y.z) * (d0 - vec2(7.0, 10.0));
    col = mix(col, col * SHADOW, ss(1.5, -1.2, yachtHullSD(qs)) * 0.68);
    float yh = yachtHullSD(q);
    if (yh < 0.8) {
      vec3 yc = mix(vec3(0.98, 0.99, 1.0), vec3(0.82, 0.86, 0.91), ss(-4.0, 0.0, yh));
      // Kính chắn gió xám đậm
      float win = (length((q - vec2(4.0, 0.0)) / vec2(4.5, 3.8)) - 1.0) * 3.8;
      if (q.x > 1.0) yc = mix(yc, vec3(0.24, 0.29, 0.36), ss(0.5, -0.5, win));
      // Khu vực ghế ngồi boong sau xám nhạt
      float deck = max(abs(q.y) - 3.6, max(q.x + 2.0, -q.x - 15.0));
      yc = mix(yc, vec3(0.85, 0.88, 0.92), ss(0.5, -0.5, deck));
      col = mix(col, yc, ss(0.6, -0.6, yh));
    }
  }

  // ---------- Hải âu ----------
  for (int i = 0; i < 8; i++) {
    if (float(i) >= uBirdN) break;
    vec4 b = uBird[i];
    vec2 d0 = p - b.xy, d1 = d0 - vec2(34.0, 55.0);
    if (dot(d1, d1) < 400.0) {
      vec3 g = gullSD(rot(-b.z) * d1, b.w);
      col = mix(col, col * SHADOW, ss(1.8, -1.8, min(g.x, g.y)) * 0.35);
    }
    if (dot(d0, d0) < 400.0) {
      vec3 g = gullSD(rot(-b.z) * d0, b.w);
      vec3 wingC = mix(vec3(0.86, 0.90, 0.94), vec3(0.22, 0.25, 0.30), ss(0.72, 0.8, g.z));
      col = mix(col, wingC, ss(0.6, -0.6, g.y));
      col = mix(col, vec3(0.99, 0.99, 1.0), ss(0.6, -0.6, g.x));
    }
  }

  // ---------- Bóng mây xanh đậm đổ trên mặt biển ----------
  float sd = cloudDist(p - SHADOW_OFF);
  col = mix(col, col * SHADOW, ss(3.0, -3.0, sd) * 0.82);

  // ---------- Mây trắng ----------
  vec4 fc = vec4(0.0, -1e9, 0.0, 0.0);
  float d = cloudDist(p, true, fc);
  if (d < 1.5) {
    float hi = d > -21.0 ? ss(-1.0, 1.0, cloudDist(p + LIGHT * 20.0)) : 0.0;
    vec3 cc = fc.y > -1e8 ? mix(CLOUD_BODY, CLOUD_SH, fc.w * 0.6) : mix(CLOUD_BODY, CLOUD_SH, 0.45);
    cc = mix(cc, CLOUD_HI, hi);
    col = mix(col, cc, ss(1.0, -1.0, d));
  }
  if (uDebug > 0.5) col = mix(col, vec3(0.9, 0.15, 0.15), 1.0 - ss(0.0, 1.5, abs(d)));
  o = vec4(col, 1.0);
}`;

const cv = document.getElementById('art');
const gl = cv.getContext('webgl2', { antialias: false });
if (!gl) document.getElementById('nogl').style.display = 'grid';
function program(fs) {
  const mk = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); throw new Error('shader'); }
    return s;
  };
  const p = gl.createProgram();
  gl.attachShader(p, mk(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  const U = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, ''); U[nm] = gl.getUniformLocation(p, nm); }
  return { p, U };
}
const PR = program(FS);
gl.bindVertexArray(gl.createVertexArray());

let noiseTex = null;
function buildNoiseTex() {
  const { S, d } = makeNoiseImage();
  noiseTex = gl.createTexture();

let resizeT = 0;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    resize(); refresh(); skyClouds.length = 0;
    boats.length = 0; yachts.length = 0; syncBoats(); syncYachts();
  }, 100);
});

resize();
buildNoiseTex();
if (WALL || PREVIEW) startHostedMode();
else { commit(true); syncBoats(); syncYachts(); syncBirds(false); }
requestAnimationFrame(frame);

function applySettings(v) {
  if (typeof v.seed === 'number' && v.seed !== seed) reseed(v.seed);
  let field = false, adaptiveChanged = false, boat = false, yacht = false, bird = false;
  for (const k in v) {
    if ((!SLIDERS.some(s => s.key === k) && !DISPLAY_KEYS.includes(k)) || typeof v[k] !== typeof P[k] || P[k] === v[k]) continue;
    if (DISPLAY_KEYS.includes(k) && v[k] !== 0 && v[k] !== 1) continue;
    P[k] = v[k];
    if (k === 'adaptive') adaptiveChanged = true;
    else if (k === 'sigma') field = true;
    else if (k === 'boats') boat = true;
    else if (k === 'yachts') yacht = true;
    else if (k === 'birds') bird = true;
  }
  if (adaptiveChanged && FB) commit();
  else if (field && FB) refresh();
  if (boat) syncBoats();
  if (yacht) syncYachts();
  if (bird) syncBirds();
}

function drawGhosts() {
  const box = document.getElementById('ghosts');
  box.innerHTML = icons.map(ic => `<div class="ghost" style="left:${ic.x}px;top:${ic.y}px;width:${ic.w}px;height:${ic.h}px"><i></i><b></b></div>`).join('');
}

function startHostedMode() {
  document.body.classList.add('wall');
  if (PREVIEW) {
    document.body.classList.add('preview');
    const g = document.createElement('div'); g.id = 'ghosts'; document.body.appendChild(g);
  }
  icons = [];
  commit(true);
  syncBirds(false);
  let first = true;
  const handle = m => {
    if (m.t === 'pause') { paused = !!m.v; return; }
    if (m.t === 'settings') { applySettings(m.v || {}); return; }
    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t !== 'icons') return;
    const k = window.devicePixelRatio || 1;
    icons = m.vis ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];
    if (PREVIEW) drawGhosts();
    iconsSeen = true;
    commit(first);
    if (first) { curMix = 1; boats.length = 0; yachts.length = 0; syncBoats(); syncYachts(); curMix = 0; first = false; }
  };
  if (PREVIEW) {
    addEventListener('message', ev => { if (ev.source === parent) handle(typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data); });
    parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
    return;
  }
  const host = window.chrome && window.chrome.webview;
  if (!host) return;
  host.addEventListener('message', ev => handle(JSON.parse(ev.data)));
  host.postMessage('ready');
}
</script>
<script src="share.js"></script>

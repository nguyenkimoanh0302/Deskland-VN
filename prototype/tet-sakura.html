<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deskland · Hoa anh đào ngày Tết</title>
<style>
  :root { --taskbar: 48px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f7efe2; }
  body { font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #desktop { position: fixed; left: 0; top: 0; right: 0; bottom: var(--taskbar); }
  #panel, #taskbar, #desktop { display: none; }
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.preview #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(255,255,255,.92); box-shadow: 3px 6px 8px rgba(90,50,55,.22); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(110,65,70,.55); }
  #nogl { position: fixed; inset: 0; display: none; place-items: center; color: #5a3838; font-size: 16px; }
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="desktop"></div>
<div id="taskbar"><div id="clock"></div></div>
<div id="nogl">Trình duyệt hiện tại không hỗ trợ WebGL2, không thể chạy hình nền.</div>

<script>
'use strict';

const CELL_W = 76, CELL_H = 100, GRID_X0 = 4, GRID_Y0 = 6, TASKBAR = 48;
const STEP = 5;
const MORPH_MS = 1800;

const QS = new URLSearchParams(location.search);
const WALL = QS.has('wallpaper');
const PREVIEW = QS.has('preview');
const P = {
  adaptive: 1,
  sigma: 80, warp: 30, petals: 0.65, wind: 1.0, lanterns: 4, swallows: 3,
  grain: 1, quality: 2, debug: false, snap: true, cap30: true,
};
const DEFAULTS = Object.assign({}, P);
const SLIDERS = [
  { key: 'adaptive', label: 'Thích ứng',             min: 0,  max: 1,   step: 1,    act: 'field' },
  { key: 'sigma',    label: 'Độ rộng khoảng sân',    min: 40, max: 200, step: 1,    act: 'field' },
  { key: 'warp',     label: 'Độ uốn lượn rừng đào',  min: 0,  max: 80,  step: 1,    act: 'field' },
  { key: 'petals',   label: 'Cánh đào rơi',          min: 0,  max: 1.0, step: 0.05 },
  { key: 'wind',     label: 'Gió xuân lay cành',     min: 0,  max: 3.0, step: 0.05 },
  { key: 'lanterns', label: 'Đèn lồng & bao lì xì',  min: 0,  max: 8,   step: 1 },
  { key: 'swallows', label: 'Chim én báo xuân',      min: 0,  max: 8,   step: 1 },
];

let seed = (Math.random() * 1e6) | 0;
function hash2(x, y, k = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed + k, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, k = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, k), b = hash2(ix + 1, iy, k), c = hash2(ix, iy + 1, k), d = hash2(ix + 1, iy + 1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y, k = 0) {
  let a = 0.5, s = 0;
  for (let i = 0; i < 4; i++) { s += a * vnoise(x, y, k + i * 7); x = x * 2.03 + 17.1; y = y * 2.03 + 17.1; a *= 0.5; }
  return s;
}
function tileNoise(x, y, px, py, k) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const m = (v, p) => ((v % p) + p) % p;
  const x0 = m(ix, px), x1 = m(ix + 1, px), y0 = m(iy, py), y1 = m(iy + 1, py);
  const a = hash2(x0, y0, k), b = hash2(x1, y0, k), c = hash2(x0, y1, k), d = hash2(x1, y1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function tileFbm(u, v, periods, k) {
  let s = 0, w = 0.5, tw = 0;
  for (let i = 0; i < periods.length; i++) { s += w * tileNoise(u * periods[i], v * periods[i], periods[i], periods[i], k + i * 13); tw += w; w *= 0.5; }
  return s / tw;
}
function makeNoiseImage() {
  const S = 256, d = new Uint8Array(S * S * 4);
  const chans = [[8, 16, 32, 64], [8, 16, 32, 64], [8, 16, 32], [16, 32, 64, 128]];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S, i = (y * S + x) * 4;
    for (let c = 0; c < 4; c++) {
      let n = tileFbm(u, v, chans[c], 100 + c * 50);
      d[i + c] = Math.min(Math.max((n - 0.5) * 1.9 + 0.5, 0), 1) * 255;
    }
  }
  return { S, d };
}

let W = innerWidth, H = innerHeight, Gw = 1, Gh = 1, NZ = null;
function buildNoise() {
  const N = Gw * Gh;
  NZ = { wx: new Float32Array(N), wy: new Float32Array(N) };
  for (let gy = 0; gy < Gh; gy++) for (let gx = 0; gx < Gw; gx++) {
    const i = gy * Gw + gx, x = gx * STEP, y = gy * STEP;
    NZ.wx[i] = fbm(x * 0.0028, y * 0.0028, 1) - 0.47;
    NZ.wy[i] = fbm(x * 0.0028, y * 0.0028, 2) - 0.47;
  }
}
function computeField(rects) {
  const N = Gw * Gh, f1 = new Float32Array(N);
  const sig = P.sigma, is1 = 1 / (sig * sig);
  const wa = P.warp * 2.2, wmax = wa * 0.5;
  const active = P.adaptive ? rects : [];
  for (const r of active) {
    const R = 5.5 * sig + Math.max(r.hw, r.hh) * 0.5 + wmax;
    const gx0 = Math.max(0, Math.floor((r.cx - R) / STEP)), gx1 = Math.min(Gw - 1, Math.ceil((r.cx + R) / STEP));
    const gy0 = Math.max(0, Math.floor((r.cy - R) / STEP)), gy1 = Math.min(Gh - 1, Math.ceil((r.cy + R) / STEP));
    const chw = r.hw * 0.5, chh = r.hh * 0.5;
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const i = gy * Gw + gx;
      const qx = gx * STEP + NZ.wx[i] * wa, qy = gy * STEP + NZ.wy[i] * wa;
      let dx = Math.abs(qx - r.cx) - chw, dy = Math.abs(qy - r.cy) - chh;
      if (dx < 0) dx = 0; if (dy < 0) dy = 0;
      f1[i] += Math.exp(-(dx * dx + dy * dy) * is1);
    }
  }
  const c0 = Math.sqrt(-Math.log(0.35)), s = new Float32Array(N), fMin = Math.exp(-30);
  for (let i = 0; i < N; i++) {
    const g = Math.log(Math.max(f1[i], fMin));
    s[i] = sig * (Math.sqrt(Math.max(-g, 0)) - c0) - sig * 0.6 * Math.max(g, 0);
  }
  return { s };
}
function sampleArr(a, x, y) {
  const fx = Math.min(Math.max(x / STEP, 0), Gw - 1.001), fy = Math.min(Math.max(y / STEP, 0), Gh - 1.001);
  const ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy, i = iy * Gw + ix;
  return (a[i] * (1 - tx) + a[i + 1] * tx) * (1 - ty) + (a[i + Gw] * (1 - tx) + a[i + Gw + 1] * tx) * ty;
}

const VS = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const FS = `#version 300 es
precision highp float;
uniform sampler2D uNoise, uFA, uFB;
uniform vec2 uRes, uGrid;
uniform float uScale, uSeed, uStep, uMix, uTime, uPetals, uWind, uDebug;
uniform vec4 uSwallow[8];
uniform float uSwallowN;
uniform vec4 uLantern[8];
uniform float uLanternN;
out vec4 o;

// Bảng màu nền giấy dó nắng xuân ấm áp
const vec3 PAPER_L = vec3(0.99, 0.96, 0.91);
const vec3 PAPER_M = vec3(0.96, 0.92, 0.85);
const vec3 PAPER_D = vec3(0.93, 0.87, 0.79);
const vec3 BARK_INK = vec3(0.29, 0.19, 0.18);

// Bảng màu nước hoa anh đào / đào bích ngày Tết
const vec3 SAKURA_PALE  = vec3(0.99, 0.88, 0.90);
const vec3 SAKURA_PINK  = vec3(0.96, 0.68, 0.75);
const vec3 SAKURA_PEACH = vec3(0.94, 0.52, 0.62);
const vec3 SAKURA_WARM  = vec3(0.97, 0.76, 0.72);
const vec3 GOLD_STAMEN  = vec3(0.98, 0.82, 0.32);

// Bảng màu đèn lồng đỏ và bao lì xì Tết
const vec3 RED_FEST  = vec3(0.88, 0.18, 0.20);
const vec3 RED_DARK  = vec3(0.68, 0.10, 0.14);
const vec3 GOLD_FEST = vec3(0.98, 0.82, 0.28);

float hash2(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float ss(float a, float b, float x) { float t = clamp((x - a) / (b - a), 0.0, 1.0); return t * t * (3.0 - 2.0 * t); }
vec4 N(vec2 p, float scale) { return texture(uNoise, p / scale + uSeed * 0.013); }
float fieldS(sampler2D t, vec2 p) { return texture(t, (p / uStep + 0.5) / uGrid).r; }
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
float segD(vec2 p, vec2 a, vec2 b) { vec2 pa = p - a, ba = b - a; return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0)); }

// Cánh hoa đào rơi rải rác trên sân
float fallenPetals(vec2 p) {
  vec2 G = vec2(20.0, 20.0);
  vec2 c = floor(p / G);
  float h = hash2(c + uSeed * 0.07);
  if (h > 0.36) return 0.0;
  vec2 ctr = (c + 0.22 + 0.56 * vec2(hash2(c + 1.3), hash2(c + 2.9))) * G;
  vec2 dp = rot(hash2(c + 4.7) * 6.283) * (p - ctr);
  float d = length(dp / vec2(2.4, 1.4)) - 1.0;
  return 1.0 - ss(-0.2, 0.5, d * 1.6);
}

// Tán hoa đào / anh đào màu nước và cành đào nét mực (vùng lân cận 2x2 tối ưu cho GPU tích hợp)
vec4 sakuraLayer(vec2 p, float G, float seedOff, float sDist, float minS, float t, float nLobe, out float branchAlpha) {
  branchAlpha = 0.0;
  vec2 q = p / G;
  vec2 c0 = floor(q), f = q - c0;
  int sx = f.x < 0.5 ? -1 : 1, sy = f.y < 0.5 ? -1 : 1;
  float bestD = 1e9;
  vec3 bestCol = SAKURA_PINK;
  vec2 bestCtr = vec2(0.0);
  float bestRad = 1.0, bestH = 0.0;
  for (int dy = 0; dy <= 1; dy++) for (int dx = 0; dx <= 1; dx++) {
    vec2 c = c0 + vec2(float(dx * sx), float(dy * sy));
    float h = hash2(c + seedOff);
    if (h < 0.14) continue;
    vec2 baseCtr = (c + 0.22 + 0.56 * vec2(hash2(c + seedOff + 1.3), hash2(c + seedOff + 2.7))) * G;
    float swPhase = t * (1.25 + 0.45 * h) + baseCtr.x * 0.011 + baseCtr.y * 0.009;
    vec2 ctr = baseCtr + vec2(sin(swPhase), cos(swPhase * 0.82)) * (2.5 * uWind);
    vec2 dp = p - ctr;
    float rad = G * (0.43 + 0.18 * hash2(c + seedOff + 6.1)) * (1.0 + nLobe);
    float d = length(dp) - rad;
    if (d < bestD) {
      bestD = d; bestCtr = ctr; bestRad = rad; bestH = h;
      float tone = hash2(c + seedOff + 8.9);
      vec3 cBase = tone < 0.32 ? SAKURA_PALE
                 : (tone < 0.68 ? SAKURA_PINK
                 : (tone < 0.88 ? SAKURA_WARM : SAKURA_PEACH));
      float lit = ss(rad * 0.75, -rad * 0.75, dp.x * 0.6 + dp.y * 0.8);
      cBase = mix(cBase * 0.90, mix(cBase, SAKURA_PALE, 0.45), lit);
      float rim = ss(-rad * 0.28, 0.0, d) * 0.22;
      cBase = mix(cBase, SAKURA_PEACH, rim);
      float stamen = 1.0 - ss(1.2, 3.2, d + rad);
      bestCol = mix(cBase, GOLD_STAMEN, stamen * 0.65);
    }
  }
  if (bestD < 4.5) {
    vec2 root = bestCtr + vec2((bestH - 0.5) * 8.0, bestRad * 0.62);
    vec2 tip1 = bestCtr + vec2(-bestRad * 0.38, -bestRad * 0.28);
    vec2 tip2 = bestCtr + vec2(bestRad * 0.40, -bestRad * 0.22);
    float bd = min(segD(p, root, bestCtr), min(segD(p, bestCtr, tip1), segD(p, bestCtr, tip2)));
    branchAlpha = (1.0 - ss(0.45, 1.35, bd)) * ss(minS, minS + 16.0, sDist) * 0.62;
  }
  float mask = (1.0 - ss(-1.2, 1.4, bestD)) * ss(minS, minS + 16.0, sDist);
  return vec4(bestCol, mask * 0.88);
}

// Chim én báo xuân (đuôi kéo đặc trưng)
vec3 swallowSD(vec2 q, float ph) {
  float flap = sin(ph) * 2.2;
  float body = length(q / vec2(5.2, 1.8)) - 1.0;
  // Đuôi chim én chẻ đôi
  vec2 tq = vec2(q.x + 5.5, abs(q.y) - 1.2);
  float tail = segD(tq, vec2(0.0, -0.5), vec2(-4.5, 1.4)) - 0.65;
  vec2 wq = vec2(q.x - 0.5, abs(q.y) - 1.0);
  vec2 rw = rot(-0.28 + 0.14 * sin(ph)) * wq;
  float wing = length((rw - vec2(-0.8 + flap * 0.15, 4.4)) / vec2(2.1, 5.2)) - 1.0;
  return vec3(min(body * 1.9, tail), wing * 2.1, clamp(wq.y / 9.0, 0.0, 1.0));
}

// Cánh hoa hồng phấn bay theo gió xuân
float floatingPetals(vec2 p, float t, float dens, float scale) {
  if (dens <= 0.01) return 0.0;
  vec2 wp = p - vec2(t * (24.0 + 16.0 * uWind) * scale, t * 20.0 * scale);
  wp.x += sin(p.y * 0.016 + t * 1.3) * 15.0;
  vec2 G = vec2(64.0 * scale, 64.0 * scale);
  vec2 c = floor(wp / G);
  vec2 f = (fract(wp / G) - 0.5) * G;
  float h = hash2(c + scale * 31.7 + uSeed * 0.05);
  if (h > dens * 0.75) return 0.0;
  vec2 ofs = (vec2(hash2(c + 2.3), hash2(c + 5.7)) - 0.5) * G * 0.55;
  float rotA = t * (1.6 + hash2(c + 8.1)) + h * 6.283;
  vec2 q = rot(rotA) * (f - ofs);
  float d = length(q / vec2(3.5 * scale, 2.0 * scale)) - 1.0;
  return 1.0 - ss(-0.15, 0.45, d * 2.0);
}

void main() {
  vec2 p = vec2(gl_FragCoord.x, uRes.y * uScale - gl_FragCoord.y) / uScale;
  float t = uTime;
  vec2 gp = floor(p * (0.8 * max(uScale, 1.0)));
  float g2 = hash2(gp + 7.3);

  float s0 = mix(fieldS(uFA, p), fieldS(uFB, p), uMix);
  float s = s0 + (N(p, 600.0).r - 0.5) * 10.0;

  // ---------- Nền sân xuân giấy dó ấm áp ----------
  float w1 = N(p, 1700.0).b, w2 = N(p + 281.0, 620.0).g;
  vec3 col = mix(PAPER_M, PAPER_L, ss(0.28, 0.74, w1 * 0.7 + w2 * 0.3));
  col = mix(col, PAPER_D, ss(0.45, 0.85, N(p + 847.0, 1200.0).r) * 0.35);

  if (s <= 0.0) {
    // Cánh hoa đào rơi ven khoảng sân
    float fp = fallenPetals(p) * ss(-42.0, -1.0, s);
    col = mix(col, SAKURA_PINK, fp * 0.82);
  } else {
    // ---------- Rừng hoa đào / anh đào nở rộ ----------
    float dNorm = clamp(s / 240.0, 0.0, 1.0);
    // Lớp màu nước hồng phớt dịu ở xa
    col = mix(col, vec3(0.96, 0.85, 0.84), dNorm * 0.55);

    float nLobe = (N(p, 42.0).g - 0.5) * 0.22;
    float br1 = 0.0, br2 = 0.0;
    vec4 L1 = sakuraLayer(p, 58.0, 15.0, s, 2.0, t, nLobe, br1);
    col = mix(col, BARK_INK, br1 * 0.55);
    if (L1.a > 0.001) {
      col = mix(col, L1.rgb * 0.96, L1.a * 0.84);
    }

    vec4 L2 = sakuraLayer(p + vec2(24.0, 18.0), 40.0, 43.0, s, 0.0, t, -nLobe, br2);
    col = mix(col, BARK_INK, br2 * 0.65);
    if (L2.a > 0.001) {
      col *= 1.0 - 0.06 * L2.a;
      col = mix(col, L2.rgb, L2.a * 0.90);
    }
  }

  // ---------- Đèn lồng đỏ và bao lì xì treo trên cành ----------
  for (int i = 0; i < 8; i++) {
    if (float(i) >= uLanternN) break;
    vec4 ln = uLantern[i];
    vec2 dp = p - ln.xy;
    if (dot(dp, dp) > 900.0) continue;
    float sw = sin(t * 2.1 + ln.z) * (0.12 * uWind);
    vec2 q = rot(sw) * dp;
    // Quầng sáng vàng đỏ ấm áp
    float glow = exp(-length(q) * 0.11) * 0.22;
    col = mix(col, vec3(1.0, 0.78, 0.42), glow);
    if (ln.w < 0.5) {
      // Đèn lồng đỏ tròn trịa
      float cord = segD(q, vec2(0.0, -13.0), vec2(0.0, -7.0)) - 0.6;
      float body = length(q / vec2(7.5, 6.2)) - 1.0;
      float capT = length((q - vec2(0.0, -6.0)) / vec2(3.8, 1.3)) - 1.0;
      float capB = length((q - vec2(0.0,  6.0)) / vec2(3.5, 1.2)) - 1.0;
      float tassel = segD(q, vec2(0.0, 6.5), vec2(0.0, 13.5)) - 0.85;
      col = mix(col, BARK_INK, 1.0 - ss(0.0, 0.8, cord));
      col = mix(col, GOLD_FEST, 1.0 - ss(-0.2, 0.6, tassel));
      if (body < 0.2) {
        vec3 lc = mix(RED_DARK, RED_FEST, ss(6.0, -5.0, q.x * 0.6 + q.y * 0.5));
        // Đường gân chỉ vàng trên đèn lồng
        float rib = 1.0 - ss(0.3, 0.9, abs(abs(q.x) - 3.6));
        lc = mix(lc, GOLD_FEST, rib * 0.35);
        col = mix(col, lc, 1.0 - ss(-0.15, 0.15, body));
      }
      col = mix(col, GOLD_FEST, 1.0 - ss(-0.2, 0.3, min(capT, capB)));
    } else {
      // Bao lì xì Tết
      vec2 b = abs(q) - vec2(5.2, 7.2);
      float boxD = length(max(b, 0.0)) + min(max(b.x, b.y), 0.0) - 1.2;
      float cord = segD(q, vec2(0.0, -13.0), vec2(0.0, -7.5)) - 0.6;
      col = mix(col, GOLD_FEST, 1.0 - ss(0.0, 0.8, cord));
      if (boxD < 0.8) {
        vec3 rc = mix(RED_DARK, RED_FEST, ss(6.0, -6.0, q.x + q.y * 0.5));
        // Ấn tròn nhũ vàng ở giữa bao lì xì
        float seal = 1.0 - ss(1.8, 2.5, length(q - vec2(0.0, -0.5)));
        rc = mix(rc, GOLD_FEST, seal);
        col = mix(col, rc, 1.0 - ss(-0.4, 0.6, boxD));
      }
    }
  }

  // ---------- Chim én báo xuân ----------
  for (int i = 0; i < 8; i++) {
    if (float(i) >= uSwallowN) break;
    vec4 b = uSwallow[i];
    vec2 d0 = p - b.xy, d1 = d0 - vec2(20.0, 32.0);
    if (dot(d1, d1) < 340.0) {
      vec3 g = swallowSD(rot(-b.z) * d1, b.w);
      col = mix(col, col * 0.82, ss(1.8, -1.8, min(g.x, g.y)) * 0.25);
    }
    if (dot(d0, d0) < 340.0) {
      vec2 rq = rot(-b.z) * d0;
      vec3 g = swallowSD(rq, b.w);
      col = mix(col, vec3(0.18, 0.22, 0.30), ss(0.6, -0.6, min(g.x, g.y)));
      // Cổ chim én điểm sắc đỏ nâu
      float throat = 1.0 - ss(1.0, 2.0, length(rq - vec2(3.6, 0.0)));
      col = mix(col, vec3(0.84, 0.32, 0.24), throat * ss(0.4, -0.4, g.x));
    }
  }

  // ---------- Cánh hoa đào bay theo gió ----------
  if (uPetals > 0.01) {
    float p1 = floatingPetals(p, t, uPetals, 1.0);
    float p2 = floatingPetals(p + vec2(37.0, 53.0), t * 0.86, uPetals * 0.82, 0.76);
    col = mix(col, SAKURA_PINK, p1 * 0.88);
    col = mix(col, SAKURA_PALE, p2 * 0.82);
  }

  col *= 1.0 + (g2 - 0.5) * 0.025;
  if (uDebug > 0.5) col = mix(col, vec3(0.9, 0.15, 0.15), 1.0 - ss(0.0, 1.5, abs(s0)));
  o = vec4(col, 1.0);
}`;

const cv = document.getElementById('art');
const gl = cv.getContext('webgl2', { antialias: false });
if (!gl) document.getElementById('nogl').style.display = 'grid';
function program(fs) {
  const mk = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); throw new Error('shader'); }
    return s;
  };
  const p = gl.createProgram();
  gl.attachShader(p, mk(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  const U = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, ''); U[nm] = gl.getUniformLocation(p, nm); }
  return { p, U };
}
const PR = program(FS);
gl.bindVertexArray(gl.createVertexArray());

let noiseTex = null;
function buildNoiseTex() {
  const { S, d } = makeNoiseImage();
  noiseTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, noiseTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, S, S, 0, gl.RGBA, gl.UNSIGNED_BYTE, d);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
}
const f32 = new Float32Array(1), u32 = new Uint32Array(f32.buffer);
function toHalf(v) {
  f32[0] = v; const x = u32[0];
  const sign = (x >>> 16) & 0x8000, e = ((x >>> 23) & 0xff) - 112, m = x & 0x7fffff;
  if (e <= 0) return sign;
  if (e >= 31) return sign | 0x7c00;
  return sign | (e << 10) | (m >>> 13);
}
const ftex = [null, null];
let fromI = 0, toI = 0, morphT0 = -1e9, morphDur = MORPH_MS, FA = null, FB = null;
function allocField() {
  for (let i = 0; i < 2; i++) {
    if (ftex[i]) gl.deleteTexture(ftex[i]);
    ftex[i] = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, ftex[i]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, Gw, Gh, 0, gl.RED, gl.HALF_FLOAT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }
}
function uploadField(i, Fd) {
  const d = new Uint16Array(Gw * Gh);
  for (let k = 0; k < d.length; k++) d[k] = toHalf(Fd.s[k]);
  gl.bindTexture(gl.TEXTURE_2D, ftex[i]);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, Gw, Gh, gl.RED, gl.HALF_FLOAT, d);
}

let icons = [];
const iconRects = () => icons.map(ic => ({ cx: ic.x + ic.w / 2, cy: ic.y + ic.h / 2, hw: ic.w / 2 - 4, hh: ic.h / 2 - 2 }));
function commit(fromEmpty = false) {
  const nf = computeField(iconRects());
  const target = 1 - toI;
  if (fromEmpty) { FA = computeField([]); uploadField(toI, FA); }
  else FA = FB;
  FB = nf;
  uploadField(target, FB);
  fromI = toI; toI = target;
  morphT0 = performance.now();
  morphDur = fromEmpty ? 2600 : MORPH_MS;
  placeLanterns();
}
function refresh() {
  FA = FB = computeField(iconRects());
  uploadField(toI, FB);
  fromI = toI; morphT0 = -1e9;
  placeLanterns();
}

let curMix = 1;

/* ======================================================================
   Đèn lồng đỏ / bao lì xì Tết và chim én báo xuân
   ====================================================================== */
const lanterns = [], lanternUniform = new Float32Array(32);
function placeLanterns() {
  lanterns.length = 0;
  if (!FB) return;
  const want = Math.max(0, Math.min(8, Math.round(P.lanterns)));
  for (let n = 0; n < want; n++) {
    let best = null, bestScore = -1e9;
    for (let k = 0; k < 60; k++) {
      const u = hash2(n * 31 + k, 11, 700), v = hash2(n * 31 + k, 23, 700);
      const x = 60 + u * Math.max(100, W - 120);
      const y = 60 + v * Math.max(100, H - TASKBAR - 120);
      const s = sampleArr(FB.s, x, y);
      if (s < 14 || s > 95) continue;
      let minDist = 1e9;
      for (const o of lanterns) minDist = Math.min(minDist, Math.hypot(o.x - x, o.y - y));
      const score = Math.min(minDist, 260) - Math.abs(s - 38) * 1.2;
      if (minDist > 75 && score > bestScore) {
        bestScore = score;
        best = { x, y, ph: hash2(n, k, 710) * 6.283, kind: (n % 2 === 0) ? 0.0 : 1.0 };
      }
    }
    if (best) lanterns.push(best);
  }
  for (let i = 0; i < lanterns.length; i++) {
    lanternUniform[i * 4] = lanterns[i].x;
    lanternUniform[i * 4 + 1] = lanterns[i].y;
    lanternUniform[i * 4 + 2] = lanterns[i].ph;
    lanternUniform[i * 4 + 3] = lanterns[i].kind;
  }
}

const swallows = [], swallowUniform = new Float32Array(32);
function spawnSwallow() {
  const a = Math.random() * Math.PI * 2;
  return {
    x: 80 + Math.random() * Math.max(100, W - 160),
    y: 80 + Math.random() * Math.max(100, H - TASKBAR - 160),
    a, sp: 28 + Math.random() * 16, turn: (Math.random() - 0.5) * 0.3,
    ph: Math.random() * 6.28, timer: 2 + Math.random() * 3.5,
  };
}
function stepSwallows(dt) {
  const want = Math.max(0, Math.min(8, Math.round(P.swallows)));
  while (swallows.length < want) swallows.push(spawnSwallow());
  if (swallows.length > want) swallows.length = want;
  for (let i = 0; i < swallows.length; i++) {
    const b = swallows[i];
    b.timer -= dt;
    if (b.timer <= 0) { b.turn = (Math.random() - 0.5) * 0.6; b.timer = 2.0 + Math.random() * 3.5; }
    const m = 110;
    if (b.x < m) b.turn += (Math.cos(b.a) < 0 ? 0.9 : 0.35) * dt;
    if (b.x > W - m) b.turn -= (Math.cos(b.a) > 0 ? 0.9 : 0.35) * dt;
    if (b.y < m) b.turn += (Math.sin(b.a) < 0 ? 0.9 : 0.35) * dt;
    if (b.y > H - TASKBAR - m) b.turn -= (Math.sin(b.a) > 0 ? 0.9 : 0.35) * dt;
    b.a += b.turn * dt;
    b.x += Math.cos(b.a) * b.sp * dt;
    b.y += Math.sin(b.a) * b.sp * dt;
    b.ph += dt * 8.2;
    swallowUniform[i * 4] = b.x;
    swallowUniform[i * 4 + 1] = b.y;
    swallowUniform[i * 4 + 2] = b.a;
    swallowUniform[i * 4 + 3] = b.ph;
  }
}

function resize() {
  W = innerWidth; H = innerHeight;
  const scale = PREVIEW ? 0.38 : Math.min(devicePixelRatio || 1, 0.72);
  const box = cv.getBoundingClientRect();
  cv.width = Math.round((box.width || W) * scale); cv.height = Math.round((box.height || H) * scale); cv._scale = scale;
  Gw = Math.ceil(W / STEP) + 2; Gh = Math.ceil(H / STEP) + 2;
  buildNoise();
  allocField();
}

const T0 = performance.now();
let lastT = 0, frameN = 0, paused = false;
function frame(now) {
  requestAnimationFrame(frame);
  if (paused) { lastT = 0; return; }
  if (P.cap30 && now - lastT < 40) return;
  const dt = lastT ? Math.min((now - lastT) / 1000, 0.1) : 0.03;
  lastT = now;
  const e = Math.min((now - morphT0) / morphDur, 1);
  curMix = e < 0.5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2;
  stepSwallows(dt);
  draw(now);
  frameN++;
}
function draw(now) {
  const { p, U } = PR;
  gl.useProgram(p);
  gl.viewport(0, 0, cv.width, cv.height);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, noiseTex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, ftex[fromI]);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, ftex[toI]);
  gl.uniform1i(U.uNoise, 0); gl.uniform1i(U.uFA, 1); gl.uniform1i(U.uFB, 2);
  gl.uniform2f(U.uRes, cv.width / cv._scale, cv.height / cv._scale);
  gl.uniform2f(U.uGrid, Gw, Gh);
  gl.uniform1f(U.uScale, cv._scale);
  gl.uniform1f(U.uSeed, (seed % 997) * 0.37);
  gl.uniform1f(U.uStep, STEP);
  gl.uniform1f(U.uMix, curMix);
  gl.uniform1f(U.uTime, (now - T0) / 1000);
  gl.uniform1f(U.uPetals, P.petals);
  gl.uniform1f(U.uWind, P.wind);
  gl.uniform1f(U.uDebug, P.debug ? 1 : 0);
  gl.uniform1f(U.uLanternN, lanterns.length);
  if (lanterns.length) gl.uniform4fv(U.uLantern, lanternUniform);
  gl.uniform1f(U.uSwallowN, swallows.length);
  if (swallows.length) gl.uniform4fv(U.uSwallow, swallowUniform);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

let iconsSeen = !(WALL || PREVIEW);
function reseed(v) {
  seed = v; buildNoise();
  swallows.length = 0;
  if (!iconsSeen) return;
  commit(true);
}
let resizeT = 0;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { resize(); refresh(); }, 100);
});

resize();
buildNoiseTex();
if (WALL || PREVIEW) startHostedMode();
else commit(true);
requestAnimationFrame(frame);

function applySettings(v) {
  if (typeof v.seed === 'number' && v.seed !== seed) reseed(v.seed);
  let field = false, lanternRe = false;
  for (const k in v) {
    if (!SLIDERS.some(s => s.key === k) || typeof v[k] !== typeof P[k] || P[k] === v[k]) continue;
    P[k] = v[k];
    if (k === 'sigma' || k === 'warp' || k === 'adaptive') field = true;
    if (k === 'lanterns') lanternRe = true;
  }
  if (field && FB) refresh();
  else if (lanternRe && FB) placeLanterns();
}

function drawGhosts() {
  const box = document.getElementById('ghosts');
  box.innerHTML = icons.map(ic => `<div class="ghost" style="left:${ic.x}px;top:${ic.y}px;width:${ic.w}px;height:${ic.h}px"><i></i><b></b></div>`).join('');
}

function startHostedMode() {
  document.body.classList.add('wall');
  if (PREVIEW) {
    document.body.classList.add('preview');
    const g = document.createElement('div'); g.id = 'ghosts'; document.body.appendChild(g);
  }
  icons = [];
  commit(true);
  let first = true;
  const handle = m => {
    if (m.t === 'pause') { paused = !!m.v; return; }
    if (m.t === 'settings') { applySettings(m.v || {}); return; }
    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t !== 'icons') return;
    const k = window.devicePixelRatio || 1;
    icons = m.vis ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];
    if (PREVIEW) drawGhosts();
    iconsSeen = true;
    commit(first);
    first = false;
  };
  if (PREVIEW) {
    addEventListener('message', ev => { if (ev.source === parent) handle(typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data); });
    parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
    return;
  }
  const host = window.chrome && window.chrome.webview;
  if (!host) return;
  host.addEventListener('message', ev => handle(JSON.parse(ev.data)));
  host.postMessage('ready');
}
</script>

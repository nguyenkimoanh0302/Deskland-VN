<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deskland · Chuyến xe chiều</title>
<!--
  Deskland · Chủ đề Chuyến xe chiều (phong cảnh nhìn ngang kiểu hoạt hình; WebGL2 2D)
  - Trời đổi màu theo giờ trong ngày (hoặc cố định ngày / hoàng hôn / đêm); phố bên sông, cầu vòm sáng đèn về đêm
  - Con đường có trạm dừng, đèn đường; xe buýt vàng chạy qua, dừng mở cửa ở trạm
  - Lau sậy tiền cảnh đung đưa theo gió; biểu tượng nằm trên đồi cỏ
  - Bấm: đường -> gọi xe buýt dừng tại đó (đang chạy qua thì bấm còi); trời -> đàn chim (ngày) / sao băng (đêm);
    cỏ / sông -> gió rạp lau + hạt bồ công anh (ngày) / đom đóm (đêm)
  Shader dùng chung với bản Rust: commute.frag
-->
<style>
  :root { --taskbar: 48px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f0b27a; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: pointer; }
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.preview #ghosts, body.demo #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(255,255,255,.88); box-shadow: 3px 6px 8px rgba(40,40,60,.32); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.78); }
</style>
</head>
<body>
<canvas id="art"></canvas>
<script>
'use strict';
const TASKBAR = 48, STEP = 5, MORPH_MS = 1800;
const QS = new URLSearchParams(location.search);
const WALL = QS.has('wallpaper'), PREVIEW = QS.has('preview'), DEMO = !WALL && !PREVIEW;
// Giá trị mặc định khớp themes.json. time: 0 theo giờ máy, 1 ngày, 2 hoàng hôn, 3 đêm
const DEFAULTS = { sigma: 70, warp: 30, time: 0, wind: 1, reeds: 0.7, lights: 1, busFreq: 1 };
const P = Object.assign({}, DEFAULTS);

/* ---------------- Nhiễu CPU + texture nhiễu (giống meadow.html / engine.rs) ---------------- */
let seed = (Math.random() * 1e6) | 0;
function hash2(x, y, k = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed + k, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, k = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, k), b = hash2(ix + 1, iy, k), c = hash2(ix, iy + 1, k), d = hash2(ix + 1, iy + 1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y, k = 0) {
  let a = 0.5, s = 0;
  for (let i = 0; i < 4; i++) { s += a * vnoise(x, y, k + i * 7); x = x * 2.03 + 17.1; y = y * 2.03 + 17.1; a *= 0.5; }
  return s;
}
function tileNoise(x, y, px, py, k) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const m = (v, p) => ((v % p) + p) % p;
  const x0 = m(ix, px), x1 = m(ix + 1, px), y0 = m(iy, py), y1 = m(iy + 1, py);
  const a = hash2(x0, y0, k), b = hash2(x1, y0, k), c = hash2(x0, y1, k), d = hash2(x1, y1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function tileFbm(u, v, periods, k) {
  let s = 0, w = 0.5, tw = 0;
  for (let i = 0; i < periods.length; i++) { s += w * tileNoise(u * periods[i], v * periods[i], periods[i], periods[i], k + i * 13); tw += w; w *= 0.5; }
  return s / tw;
}
function makeNoiseImage() {
  const S = 256, d = new Uint8Array(S * S * 4);
  const chans = [[8, 16, 32, 64], [8, 16, 32, 64], [8, 16, 32], [16, 32, 64, 128]];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S, i = (y * S + x) * 4;
    for (let c = 0; c < 4; c++) d[i + c] = Math.min(Math.max((tileFbm(u, v, chans[c], 100 + c * 50) - 0.5) * 1.9 + 0.5, 0), 1) * 255;
  }
  return { S, d };
}

/* ---------------- Trường khoảng cách quanh biểu tượng (rạn cát) ---------------- */
let W = innerWidth, H = innerHeight, Gw = 1, Gh = 1, NZ = null;
function buildNoise() {
  const N = Gw * Gh;
  NZ = { wx: new Float32Array(N), wy: new Float32Array(N) };
  for (let gy = 0; gy < Gh; gy++) for (let gx = 0; gx < Gw; gx++) {
    const i = gy * Gw + gx, x = gx * STEP, y = gy * STEP;
    NZ.wx[i] = fbm(x * 0.0028, y * 0.0028, 1) - 0.47;
    NZ.wy[i] = fbm(x * 0.0028, y * 0.0028, 2) - 0.47;
  }
}
function computeField(rects) {
  const N = Gw * Gh, f1 = new Float32Array(N);
  const sig = P.sigma, is1 = 1 / (sig * sig), wa = P.warp * 2.2, wmax = wa * 0.5;
  for (const r of rects) {
    const R = 5.5 * sig + Math.max(r.hw, r.hh) * 0.5 + wmax;
    const gx0 = Math.max(0, Math.floor((r.cx - R) / STEP)), gx1 = Math.min(Gw - 1, Math.ceil((r.cx + R) / STEP));
    const gy0 = Math.max(0, Math.floor((r.cy - R) / STEP)), gy1 = Math.min(Gh - 1, Math.ceil((r.cy + R) / STEP));
    const chw = r.hw * 0.5, chh = r.hh * 0.5;
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const i = gy * Gw + gx;
      const qx = gx * STEP + NZ.wx[i] * wa, qy = gy * STEP + NZ.wy[i] * wa;
      let dx = Math.abs(qx - r.cx) - chw, dy = Math.abs(qy - r.cy) - chh;
      if (dx < 0) dx = 0; if (dy < 0) dy = 0;
      f1[i] += Math.exp(-(dx * dx + dy * dy) * is1);
    }
  }
  const c0 = Math.sqrt(-Math.log(0.35)), s = new Float32Array(N), fMin = Math.exp(-30);
  for (let i = 0; i < N; i++) {
    const g = Math.log(Math.max(f1[i], fMin));
    s[i] = sig * (Math.sqrt(Math.max(-g, 0)) - c0) - sig * 0.6 * Math.max(g, 0);
  }
  return s;
}
function sampleArr(a, x, y) {
  const fx = Math.min(Math.max(x / STEP, 0), Gw - 1.001), fy = Math.min(Math.max(y / STEP, 0), Gh - 1.001);
  const ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy, i = iy * Gw + ix;
  return (a[i] * (1 - tx) + a[i + 1] * tx) * (1 - ty) + (a[i + Gw] * (1 - tx) + a[i + Gw + 1] * tx) * ty;
}

/* ---------------- WebGL ---------------- */
const cv = document.getElementById('art');
const gl = cv.getContext('webgl2', { antialias: false });
const VS = `#version 300 es
void main() { vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
let PR = null;
function program(fs) {
  const mk = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); throw new Error('shader'); }
    return s;
  };
  const p = gl.createProgram();
  gl.attachShader(p, mk(gl.VERTEX_SHADER, VS)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  const U = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, ''); U[nm] = gl.getUniformLocation(p, nm); }
  return { p, U };
}
gl.bindVertexArray(gl.createVertexArray());
let noiseTex = null;
function buildNoiseTex() {
  const { S, d } = makeNoiseImage();
  if (noiseTex) gl.deleteTexture(noiseTex);
  noiseTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, noiseTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, S, S, 0, gl.RGBA, gl.UNSIGNED_BYTE, d);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
}
const f32 = new Float32Array(1), u32 = new Uint32Array(f32.buffer);
function toHalf(v) {
  f32[0] = v; const x = u32[0];
  const sign = (x >>> 16) & 0x8000, e = ((x >>> 23) & 0xff) - 112, m = x & 0x7fffff;
  if (e <= 0) return sign; if (e >= 31) return sign | 0x7c00;
  return sign | (e << 10) | (m >>> 13);
}
const ftex = [null, null];
let fromI = 0, toI = 0, morphT0 = -1e9, morphDur = MORPH_MS, FA = null, FB = null, curMix = 1;
function allocField() {
  for (let i = 0; i < 2; i++) {
    if (ftex[i]) gl.deleteTexture(ftex[i]);
    ftex[i] = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, ftex[i]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, Gw, Gh, 0, gl.RED, gl.HALF_FLOAT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }
}
function uploadField(i, s) {
  const d = new Uint16Array(Gw * Gh);
  for (let k = 0; k < d.length; k++) d[k] = toHalf(s[k]);
  gl.bindTexture(gl.TEXTURE_2D, ftex[i]);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, Gw, Gh, gl.RED, gl.HALF_FLOAT, d);
}
let icons = [];
const iconRects = () => icons.map(ic => ({ cx: ic.x + ic.w / 2, cy: ic.y + ic.h / 2, hw: ic.w / 2 - 4, hh: ic.h / 2 - 2 }));
function commit(fromEmpty = false) {
  const nf = computeField(iconRects());
  const target = 1 - toI;
  if (fromEmpty) { FA = computeField([]); uploadField(toI, FA); } else FA = FB;
  FB = nf; uploadField(target, FB);
  fromI = toI; toI = target;
  morphT0 = performance.now(); morphDur = fromEmpty ? 2600 : MORPH_MS;
  onField();
}
const curS = (x, y) => FB ? sampleArr(FA, x, y) * (1 - curMix) + sampleArr(FB, x, y) * curMix : 999;

/* ---------------- Bố cục (khớp commute.frag) ---------------- */
const HU = () => H - TASKBAR;
const yRiver = () => HU() * 0.56, yRoad = () => HU() * 0.715, yWheel = () => HU() * 0.79;
const ss = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
// Giờ trong ngày 0..1: theo đồng hồ máy hoặc cố định (ngày / hoàng hôn / đêm)
function tod() {
  const m = Math.round(P.time);
  if (m === 1) return 0.5;
  if (m === 2) return 0.735;
  if (m === 3) return 0.95;
  const d = new Date();
  return (d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600) / 24;
}
const nightW = t => Math.min(1, Math.max(0, 1 - ss(0.21, 0.29, t) + ss(0.79, 0.87, t)));
function onField() { needDraw = true; }

/* ---------------- Xe buýt ---------------- */
const rand = Math.random;
const bus = { x: -9999, dir: 1, v: 0, state: 'off', target: null, doors: 0, honk: -1, brake: 0, rot: 0, alpha: 0, next: 4, t: 0 };
let stopX = 0;
function spawnBus(dir, target) {
  bus.dir = dir; bus.x = dir > 0 ? -170 : W + 170; bus.v = 95; bus.state = 'drive';
  bus.target = target; bus.doors = 0; bus.alpha = 1; bus.t = 0;
}
function stepBus(dt) {
  bus.honk = bus.honk >= 0 ? (bus.honk + dt > 0.8 ? -1 : bus.honk + dt) : -1;
  if (bus.state === 'off') {
    bus.next -= dt;
    if (bus.next <= 0) spawnBus(rand() < 0.75 ? 1 : -1, rand() < 0.7 ? stopX : null);
    return;
  }
  let want = 95, decel = false;
  if (bus.state === 'drive' && bus.target != null) {
    const d = (bus.target - bus.x) * bus.dir;
    if (d < -40) bus.target = null;                                   // đã qua trạm: bỏ dừng
    else if (d < 150) { want = Math.max(0, d * 0.75); decel = true; if (d < 1.5) { bus.state = 'stop'; bus.t = 3.6; bus.v = 0; } }
  }
  if (bus.state === 'stop') {
    bus.t -= dt;
    bus.doors = Math.min(1, Math.max(0, bus.t > 1 ? bus.doors + dt * 2 : bus.doors - dt * 2));
    if (bus.t <= 0) { bus.state = 'drive'; bus.target = null; bus.honk = 0; }
    want = 0;
  }
  bus.v += (want - bus.v) * Math.min(1, dt * (decel ? 3 : 0.9));
  bus.brake += ((decel || bus.state === 'stop' ? 1 : 0) - bus.brake) * Math.min(1, dt * 6);
  bus.x += bus.v * bus.dir * dt;
  bus.rot -= bus.v * dt / 13;
  if (bus.state === 'drive' && bus.target == null && (bus.x < -200 || bus.x > W + 200)) {
    bus.state = 'off'; bus.alpha = 0; bus.next = (22 + rand() * 26) / Math.max(0.2, P.busFreq);
  }
}

/* ---------------- Hạt: chim, bồ công anh, đom đóm; sao băng; gió ---------------- */
let parts = [], star = null, gust = null, ambT = 6;
function addPart(x, y, kind, vx, vy, life) { if (parts.length >= 24) parts.shift(); parts.push({ x, y, kind, vx, vy, life, age: 0, ph: rand() * 6.28, seed: rand() * 100 }); }
function flock(x, y, dir) { for (let i = 0; i < 5; i++) addPart(x - dir * i * 18, y + (i % 2 ? 1 : -1) * i * 7, 0, dir * (95 + rand() * 15), -8 + rand() * 6, 16); }
function stepParts(dt, night) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.age += dt;
    if (p.kind === 0) { p.ph += dt * 11; p.vy += Math.sin(p.age * 1.3 + p.seed) * 6 * dt; }
    else if (p.kind === 1) { p.vx += (P.wind * 22 - p.vx) * dt * 0.5; p.vy += (-14 + Math.sin(p.age * 2 + p.seed) * 10 - p.vy) * dt; p.ph += dt; }
    else { p.ph += dt; p.vx += (vnoise(p.age * 0.6, p.seed, 9) - 0.5) * 60 * dt; p.vy += (vnoise(p.age * 0.6, p.seed + 30, 9) - 0.5) * 60 * dt; p.vx *= 0.98; p.vy *= 0.98; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.age > p.life || p.x < -60 || p.x > W + 60 || p.y < -40) parts.splice(i, 1);
  }
  // Cảnh nền tự sinh: đom đóm ban đêm, thỉnh thoảng có đàn chim ban ngày
  ambT -= dt;
  if (ambT <= 0) {
    ambT = night ? 1.2 : 30 + rand() * 30;
    if (night && parts.filter(p => p.kind === 2).length < 8) addPart(rand() * W, HU() * (0.78 + rand() * 0.18), 2, 0, 0, 14);
    else if (!night) { const d = rand() < 0.5 ? 1 : -1; flock(d > 0 ? -40 : W + 40, HU() * (0.12 + rand() * 0.25), d); }
  }
  if (star) { star.age += dt; if (star.age > 1.2) star = null; }
  if (gust) { gust.age += dt; if (gust.age > 3) gust = null; }
}

/* ---------------- Bấm chuột ---------------- */
function click(x, y) {
  const s = curS(x, y), night = nightW(tod()) > 0.5;
  if (s > 10 && y > yRoad() - 40 && y < yWheel() + 25) {
    // Gọi xe buýt dừng ở chỗ bấm
    stopX = Math.max(60, Math.min(W - 60, x));
    if (bus.state === 'off') spawnBus(stopX > 260 ? 1 : -1, stopX);
    else if (bus.state === 'drive' && (stopX - bus.x) * bus.dir > 70) bus.target = stopX;
    else bus.honk = 0;
    return;
  }
  if (s > 10 && y < yRiver() - 20) {
    if (night) star = { x, y, age: 0, ang: (x < W / 2 ? 0.35 : Math.PI - 0.35) };
    else flock(x, y, x < W / 2 ? 1 : -1);
    return;
  }
  // Cỏ / đồi / sông: gió rạp lau + hạt bay
  gust = { x, y, age: 0, str: 1 };
  for (let i = 0; i < 8; i++) {
    if (night) addPart(x + (rand() - 0.5) * 60, y + (rand() - 0.5) * 40, 2, (rand() - 0.5) * 40, (rand() - 0.5) * 40, 9);
    else addPart(x + (rand() - 0.5) * 40, y - rand() * 20, 1, (rand() - 0.3) * 40, -20 - rand() * 20, 8);
  }
}

/* ---------------- Vòng vẽ ---------------- */
const partA = new Float32Array(24 * 4);
const T0 = performance.now();
let lastT = 0, paused = false, needDraw = true, T = 0;
function resize() {
  W = innerWidth; H = innerHeight;
  const scale = PREVIEW ? 0.38 : Math.min(devicePixelRatio || 1, 0.72);
  cv.width = Math.round(W * scale); cv.height = Math.round(H * scale); cv._scale = scale;
  Gw = Math.ceil(W / STEP) + 2; Gh = Math.ceil(H / STEP) + 2;
  buildNoise(); allocField();
  FA = FB = null;
  commit(true);
  stopX = W * 0.34;
}
function frame(now) {
  requestAnimationFrame(frame);
  if (paused) { lastT = 0; if (needDraw) { needDraw = false; curMix = 1; draw(now); } return; }
  if (now - lastT < 40) return;
  const dt = lastT ? Math.min((now - lastT) / 1000, 0.1) : 0.03;
  lastT = now; T += dt;
  const e = Math.min((now - morphT0) / morphDur, 1);
  curMix = e < 0.5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2;
  stepBus(dt);
  stepParts(dt, nightW(tod()) > 0.5);
  draw(now);
}
function draw(now) {
  if (!PR) return;
  const { p, U } = PR;
  gl.useProgram(p);
  gl.viewport(0, 0, cv.width, cv.height);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, noiseTex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, ftex[fromI]);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, ftex[toI]);
  gl.uniform1i(U.uNoise, 0); gl.uniform1i(U.uFA, 1); gl.uniform1i(U.uFB, 2);
  gl.uniform2f(U.uRes, cv.width / cv._scale, cv.height / cv._scale);
  gl.uniform2f(U.uGrid, Gw, Gh);
  gl.uniform1f(U.uScale, cv._scale);
  gl.uniform1f(U.uSeed, (((seed % 997) + 997) % 997) * 0.37);
  gl.uniform1f(U.uStep, STEP);
  gl.uniform1f(U.uMix, curMix);
  gl.uniform1f(U.uTime, (now - T0) / 1000);
  gl.uniform1f(U.uDebug, 0);
  gl.uniform1f(U.uTod, tod());
  gl.uniform1f(U.uWind, P.wind); gl.uniform1f(U.uReeds, P.reeds); gl.uniform1f(U.uLights, P.lights);
  gl.uniform4f(U.uBus, bus.x, bus.dir, bus.rot, bus.alpha);
  gl.uniform4f(U.uBusB, bus.doors, bus.honk, bus.brake, 0);
  gl.uniform4f(U.uStop, stopX, 1, 0, 0);
  gl.uniform4f(U.uGust, gust ? gust.x : 0, gust ? gust.y : 0, gust ? gust.age : -1, gust ? gust.str : 0);
  partA.fill(0); parts.forEach((q, i) => partA.set([q.x, q.y, q.ph, q.kind], i * 4));
  gl.uniform1f(U.uPartN, parts.length); gl.uniform4fv(U.uPart, partA);
  gl.uniform4f(U.uStar, star ? star.x : 0, star ? star.y : 0, star ? star.age : -1, star ? star.ang : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ---------------- Điều khiển từ host / settings ---------------- */
function applySettings(v) {
  let field = false;
  if (typeof v.seed === 'number' && v.seed !== seed) { seed = v.seed; buildNoiseTex(); buildNoise(); field = true; }
  for (const k of Object.keys(DEFAULTS)) {
    if (typeof v[k] !== 'number' || P[k] === v[k]) continue;
    P[k] = v[k];
    if (k === 'sigma' || k === 'warp') field = true;
  }
  if (field && FB) commit();
  needDraw = true;
}
function drawGhosts() {
  const box = document.getElementById('ghosts');
  box.innerHTML = icons.map(ic => `<div class="ghost" style="left:${ic.x}px;top:${ic.y}px;width:${ic.w}px;height:${ic.h}px"><i></i><b></b></div>`).join('');
}
cv.addEventListener('pointerdown', e => click(e.clientX, e.clientY));
addEventListener('resize', resize);

fetch('commute.frag').then(r => r.text()).then(src => {
  PR = program(src);
  buildNoiseTex();
  const g = document.createElement('div'); g.id = 'ghosts'; document.body.appendChild(g);
  if (PREVIEW) document.body.classList.add('preview');
  if (DEMO) {
    document.body.classList.add('demo');
    for (let c = 0; c < 3; c++) for (let r = 0; r < 7; r++) icons.push({ x: 4 + c * 76, y: 6 + r * 100, w: 76, h: 96 });
    for (const [c, r] of [[14, 0], [15, 0], [14, 1]]) icons.push({ x: 4 + c * 76, y: 6 + r * 100, w: 76, h: 96 });
  }
  resize();
  if (DEMO) drawGhosts();
  let first = true;
  const handle = m => {
    if (m.t === 'pause') { paused = !!m.v; return; }
    if (m.t === 'settings') { applySettings(m.v || {}); return; }
    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t !== 'icons') return;
    const k = window.devicePixelRatio || 1;
    icons = m.vis ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];
    if (PREVIEW) drawGhosts();
    commit(first); first = false;
  };
  if (PREVIEW) {
    addEventListener('message', ev => { if (ev.source === parent) handle(typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data); });
    parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
  } else if (WALL) {
    const host = window.chrome && window.chrome.webview;
    if (host) { host.addEventListener('message', ev => handle(JSON.parse(ev.data))); host.postMessage('ready'); }
  }
  requestAnimationFrame(frame);
});
</script>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deskland · Rừng mưa nhiệt đới</title>
<style>
  :root { --taskbar: 48px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1f4e3d; }
  body { font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #desktop { position: fixed; left: 0; top: 0; right: 0; bottom: var(--taskbar); }
  #panel, #taskbar, #desktop { display: none; }
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.preview #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(255,255,255,.88); box-shadow: 3px 6px 8px rgba(20,45,35,.32); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.78); }
  #nogl { position: fixed; inset: 0; display: none; place-items: center; color: #fff; font-size: 16px; }
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="desktop"></div>
<div id="taskbar"><div id="clock"></div></div>
<div id="nogl">Trình duyệt hiện tại không hỗ trợ WebGL2, không thể chạy hình nền.</div>

<script>
'use strict';

const CELL_W = 76, CELL_H = 100, GRID_X0 = 4, GRID_Y0 = 6, TASKBAR = 48;
const STEP = 5;
const MORPH_MS = 1800;

const QS = new URLSearchParams(location.search);
const WALL = QS.has('wallpaper');
const PREVIEW = QS.has('preview');
const P = {
  sigma: 80, warp: 32, rain: 0.65, mist: 0.40, wind: 1.0, birds: 3, fireflies: 6,
  grain: 1, quality: 2, debug: false, snap: true, cap30: true,
};
const DEFAULTS = Object.assign({}, P);
const SLIDERS = [
  { key: 'sigma',     label: 'Khoảng trống giữa rừng', min: 40, max: 200, step: 1,    act: 'field' },
  { key: 'warp',      label: 'Độ uốn lượn bìa rừng',   min: 0,  max: 80,  step: 1,    act: 'field' },
  { key: 'rain',      label: 'Cường độ mưa',           min: 0,  max: 1,   step: 0.05 },
  { key: 'mist',      label: 'Sương mù rừng mưa',      min: 0,  max: 1,   step: 0.05 },
  { key: 'wind',      label: 'Gió lay ngọn cây',       min: 0,  max: 3,   step: 0.05 },
  { key: 'birds',     label: 'Chim nhiệt đới',         min: 0,  max: 8,   step: 1 },
  { key: 'fireflies', label: 'Đom đóm trong rừng',     min: 0,  max: 15,  step: 1 },
];

let seed = (Math.random() * 1e6) | 0;
function hash2(x, y, k = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed + k, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, k = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, k), b = hash2(ix + 1, iy, k), c = hash2(ix, iy + 1, k), d = hash2(ix + 1, iy + 1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y, k = 0) {
  let a = 0.5, s = 0;
  for (let i = 0; i < 4; i++) { s += a * vnoise(x, y, k + i * 7); x = x * 2.03 + 17.1; y = y * 2.03 + 17.1; a *= 0.5; }
  return s;
}
function tileNoise(x, y, px, py, k) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const m = (v, p) => ((v % p) + p) % p;
  const x0 = m(ix, px), x1 = m(ix + 1, px), y0 = m(iy, py), y1 = m(iy + 1, py);
  const a = hash2(x0, y0, k), b = hash2(x1, y0, k), c = hash2(x0, y1, k), d = hash2(x1, y1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function tileFbm(u, v, periods, k) {
  let s = 0, w = 0.5, tw = 0;
  for (let i = 0; i < periods.length; i++) { s += w * tileNoise(u * periods[i], v * periods[i], periods[i], periods[i], k + i * 13); tw += w; w *= 0.5; }
  return s / tw;
}
function makeNoiseImage() {
  const S = 256, d = new Uint8Array(S * S * 4);
  const chans = [[8, 16, 32, 64], [8, 16, 32, 64], [8, 16, 32], [16, 32, 64, 128]];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S, i = (y * S + x) * 4;
    for (let c = 0; c < 4; c++) {
      let n = tileFbm(u, v, chans[c], 100 + c * 50);
      d[i + c] = Math.min(Math.max((n - 0.5) * 1.9 + 0.5, 0), 1) * 255;
    }
  }
  return { S, d };
}

let W = innerWidth, H = innerHeight, Gw = 1, Gh = 1, NZ = null;
function buildNoise() {
  const N = Gw * Gh;
  NZ = { wx: new Float32Array(N), wy: new Float32Array(N) };
  for (let gy = 0; gy < Gh; gy++) for (let gx = 0; gx < Gw; gx++) {
    const i = gy * Gw + gx, x = gx * STEP, y = gy * STEP;
    NZ.wx[i] = fbm(x * 0.0028, y * 0.0028, 1) - 0.47;
    NZ.wy[i] = fbm(x * 0.0028, y * 0.0028, 2) - 0.47;
  }
}
function computeField(rects) {
  const N = Gw * Gh, f1 = new Float32Array(N);
  const sig = P.sigma, is1 = 1 / (sig * sig);
  const wa = P.warp * 2.2, wmax = wa * 0.5;
  for (const r of rects) {
    const R = 5.5 * sig + Math.max(r.hw, r.hh) * 0.5 + wmax;
    const gx0 = Math.max(0, Math.floor((r.cx - R) / STEP)), gx1 = Math.min(Gw - 1, Math.ceil((r.cx + R) / STEP));
    const gy0 = Math.max(0, Math.floor((r.cy - R) / STEP)), gy1 = Math.min(Gh - 1, Math.ceil((r.cy + R) / STEP));
    const chw = r.hw * 0.5, chh = r.hh * 0.5;
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const i = gy * Gw + gx;
      const qx = gx * STEP + NZ.wx[i] * wa, qy = gy * STEP + NZ.wy[i] * wa;
      let dx = Math.abs(qx - r.cx) - chw, dy = Math.abs(qy - r.cy) - chh;
      if (dx < 0) dx = 0; if (dy < 0) dy = 0;
      f1[i] += Math.exp(-(dx * dx + dy * dy) * is1);
    }
  }
  const c0 = Math.sqrt(-Math.log(0.35)), s = new Float32Array(N), fMin = Math.exp(-30);
  for (let i = 0; i < N; i++) {
    const g = Math.log(Math.max(f1[i], fMin));
    s[i] = sig * (Math.sqrt(Math.max(-g, 0)) - c0) - sig * 0.6 * Math.max(g, 0);
  }
  return { s };
}

const VS = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const FS = `#version 300 es
precision highp float;
uniform sampler2D uNoise, uFA, uFB;
uniform vec2 uRes, uGrid;
uniform float uScale, uSeed, uStep, uMix, uTime, uRain, uMist, uWind, uDebug;
uniform vec4 uBird[8];
uniform float uBirdN;
uniform vec4 uFly[15];
uniform float uFlyN;
out vec4 o;

// Bảng màu khoảng trống rêu xanh ẩm ướt
const vec3 MOSS_L = vec3(0.58, 0.73, 0.45);
const vec3 MOSS_M = vec3(0.46, 0.64, 0.38);
const vec3 MOSS_D = vec3(0.33, 0.52, 0.31);
const vec3 INK    = vec3(0.16, 0.30, 0.18);

// Bảng màu tán cây rừng mưa nhiệt đới nhiều tầng
const vec3 FLOOR_WET = vec3(0.11, 0.25, 0.21);
const vec3 CANOPY_0  = vec3(0.14, 0.34, 0.26);
const vec3 CANOPY_1  = vec3(0.19, 0.44, 0.32);
const vec3 CANOPY_2  = vec3(0.27, 0.55, 0.36);
const vec3 CANOPY_3  = vec3(0.38, 0.65, 0.39);
const vec3 CANOPY_TEAL = vec3(0.16, 0.47, 0.43);

float hash2(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float ss(float a, float b, float x) { float t = clamp((x - a) / (b - a), 0.0, 1.0); return t * t * (3.0 - 2.0 * t); }
vec4 N(vec2 p, float scale) { return texture(uNoise, p / scale + uSeed * 0.013); }
float fieldS(sampler2D t, vec2 p) { return texture(t, (p / uStep + 0.5) / uGrid).r; }
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
float segD(vec2 p, vec2 a, vec2 b) { vec2 pa = p - a, ba = b - a; return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0)); }

// Nét cọ mực mảnh trên thảm cỏ rêu
float mossInk(vec2 p) {
  const vec2 G = vec2(13.0, 7.0);
  vec2 c0 = floor(p / G);
  float ink = 0.0;
  for (int j = -1; j <= 1; j++) {
    vec2 c = c0 + vec2(0.0, float(j));
    vec2 cp = (c + 0.5) * G;
    float h = hash2(c + 3.1);
    float dens = 0.72 * ss(0.40, 0.72, N(cp, 850.0).r) + 0.03;
    if (h > dens) continue;
    float ang = (N(cp, 1200.0).g - 0.5) * 0.8 + (hash2(c + 7.7) - 0.5) * 0.35;
    float len = 2.4 + 2.8 * hash2(c + 1.9);
    vec2 ctr = cp + (vec2(hash2(c + 4.3), hash2(c + 5.9)) - 0.5) * vec2(2.5, 3.0);
    vec2 dir = vec2(cos(ang), sin(ang)) * len;
    float d = segD(p, ctr - dir, ctr + dir);
    ink = max(ink, (1.0 - ss(0.2, 0.9, d)) * (0.35 + 0.45 * hash2(c + 9.1)));
  }
  return ink;
}

// Vòng gợn sóng hạt mưa trên mặt đất và vũng nước (vùng lân cận 2x2)
float rainRipples(vec2 p, float t) {
  vec2 G = vec2(52.0, 52.0), q = p / G;
  vec2 c0 = floor(q), f = q - c0;
  int sx = f.x < 0.5 ? -1 : 1, sy = f.y < 0.5 ? -1 : 1;
  float rip = 0.0;
  for (int dy = 0; dy <= 1; dy++) for (int dx = 0; dx <= 1; dx++) {
    vec2 c = c0 + vec2(float(dx * sx), float(dy * sy));
    float h = hash2(c + uSeed * 0.07);
    if (h > uRain * 0.85) continue;
    float ph = fract(t * (0.65 + 0.35 * hash2(c + 2.1)) + hash2(c + 5.3));
    vec2 ctr = (c + 0.22 + 0.56 * vec2(hash2(c + 1.1), hash2(c + 3.7))) * G;
    float d = length(p - ctr);
    float r = ph * 22.0;
    float ring = (1.0 - ss(0.5, 1.8, abs(d - r))) * (1.0 - ph) * ss(0.0, 0.08, ph);
    rip = max(rip, ring);
  }
  return rip;
}

// Tầng tán cây rừng mưa nhiệt đới (vùng lân cận 2x2, không dùng atan)
vec4 canopyLayer(vec2 p, float G, float seedOff, float sDist, float minS, float t, float nLobe) {
  vec2 q = p / G;
  vec2 c0 = floor(q), f = q - c0;
  int sx = f.x < 0.5 ? -1 : 1, sy = f.y < 0.5 ? -1 : 1;
  float bestD = 1e9;
  vec3 bestCol = CANOPY_1;
  for (int dy = 0; dy <= 1; dy++) for (int dx = 0; dx <= 1; dx++) {
    vec2 c = c0 + vec2(float(dx * sx), float(dy * sy));
    float h = hash2(c + seedOff);
    if (h < 0.18) continue;
    vec2 baseCtr = (c + 0.22 + 0.56 * vec2(hash2(c + seedOff + 1.3), hash2(c + seedOff + 2.7))) * G;
    float swPhase = t * (1.3 + 0.5 * h) + baseCtr.x * 0.012 + baseCtr.y * 0.009;
    vec2 ctr = baseCtr + vec2(sin(swPhase), cos(swPhase * 0.85)) * (2.6 * uWind);
    vec2 dp = p - ctr;
    float rad = G * (0.43 + 0.19 * hash2(c + seedOff + 6.1)) * (1.0 + nLobe);
    float d = length(dp) - rad;
    if (d < bestD) {
      bestD = d;
      float tone = hash2(c + seedOff + 8.9);
      vec3 cBase = tone < 0.28 ? CANOPY_1
                 : (tone < 0.58 ? CANOPY_2
                 : (tone < 0.82 ? CANOPY_TEAL : CANOPY_3));
      float lit = ss(rad * 0.8, -rad * 0.7, dp.x * 0.65 + dp.y * 0.75);
      cBase = mix(cBase * 0.84, cBase * 1.12, lit);
      float vein = (1.0 - ss(0.4, 1.3, abs(d + rad * 0.55))) * 0.12;
      bestCol = cBase * (1.0 - vein);
    }
  }
  float mask = (1.0 - ss(-1.2, 1.2, bestD)) * ss(minS, minS + 18.0, sDist);
  return vec4(bestCol, clamp(mask, 0.0, 1.0));
}

// Chim nhiệt đới (bóng dáng chim bói cá / vẹt xanh nhìn từ trên xuống)
vec3 birdSD(vec2 q, float ph) {
  float flap = sin(ph) * 2.2;
  float body = length(q / vec2(5.5, 2.2)) - 1.0;
  vec2 wq = vec2(q.x + 0.5, abs(q.y));
  wq.y -= 1.2;
  float ang = -0.22 + 0.12 * sin(ph);
  vec2 rw = rot(ang) * wq;
  float wing = length((rw - vec2(-0.8 + flap * 0.15, 4.2)) / vec2(2.6, 5.2)) - 1.0;
  return vec3(body * 2.2, wing * 2.6, clamp(wq.y / 9.5, 0.0, 1.0));
}

// Lớp hạt mưa rơi xiên
float rainStreaks(vec2 p, float t, float dens, float speed, float scale) {
  if (dens <= 0.01) return 0.0;
  vec2 rp = rot(0.18) * p;
  rp.y -= t * speed;
  vec2 G = vec2(26.0 * scale, 140.0 * scale);
  vec2 c = floor(rp / G);
  vec2 f = fract(rp / G);
  float h = hash2(c + scale * 19.3 + uSeed * 0.03);
  if (h > dens * 0.65) return 0.0;
  float xPos = 0.2 + 0.6 * hash2(c + 4.1);
  float yStart = 0.1 + 0.3 * hash2(c + 7.3);
  float yLen = 0.35 + 0.35 * hash2(c + 9.7);
  float dx = abs(f.x - xPos) * G.x;
  float dy = f.y - yStart;
  float inY = ss(0.0, 0.08, dy) * (1.0 - ss(yLen - 0.08, yLen, dy));
  return (1.0 - ss(0.35, 1.15, dx)) * inY * (0.45 + 0.45 * (dy / max(yLen, 0.1)));
}

void main() {
  vec2 p = vec2(gl_FragCoord.x, uRes.y * uScale - gl_FragCoord.y) / uScale;
  float t = uTime;
  vec2 gp = floor(p * (0.8 * max(uScale, 1.0)));
  float g1 = hash2(gp + 0.5), g2 = hash2(gp + 7.3);

  float s0 = mix(fieldS(uFA, p), fieldS(uFB, p), uMix);
  float s = s0 + (N(p, 580.0).r - 0.5) * 11.0;

  vec3 col;
  if (s <= 0.0) {
    // ---------- Khoảng trống rêu ẩm giữa rừng (vùng biểu tượng) ----------
    float w1 = N(p, 1600.0).b, w2 = N(p + 271.0, 580.0).g;
    col = mix(MOSS_M, MOSS_L, ss(0.28, 0.74, w1 * 0.68 + w2 * 0.32));
    col = mix(col, MOSS_D, ss(0.48, 0.86, N(p + 813.0, 1100.0).r) * 0.38);
    col = mix(col, INK, mossInk(p) * 0.65 * ss(-2.0, -14.0, s));
    // Chuyển tiếp bờ rêu đậm ẩm ướt sát bìa rừng
    float edgeWet = ss(-14.0, 0.0, s);
    col = mix(col, FLOOR_WET, edgeWet * 0.48);
    // Vòng gợn nước nhỏ khi mưa rơi trên thảm rêu ẩm
    if (uRain > 0.01) {
      float rip = rainRipples(p, t);
      col = mix(col, vec3(0.78, 0.90, 0.76), rip * 0.38);
    }
  } else {
    // ---------- Nền rừng đọng nước và tán cây nhiều tầng ----------
    float dNorm = clamp(s / 240.0, 0.0, 1.0);
    col = mix(CANOPY_0, FLOOR_WET, dNorm * 0.7);

    // Gợn sóng hạt mưa ở vùng nước đọng dưới tán rừng
    if (uRain > 0.01) {
      float rip = rainRipples(p + 19.0, t * 1.08);
      col = mix(col, vec3(0.45, 0.72, 0.64), rip * 0.52);
    }

    // Hai tầng tán cây rừng mưa nhiệt đới đan xen
    float nLobe = (N(p, 44.0).g - 0.5) * 0.22;
    vec4 L1 = canopyLayer(p, 58.0, 11.0, s, 2.0, t, nLobe);
    if (L1.a > 0.001) {
      col = mix(col * 0.85, L1.rgb * 0.88, L1.a);
    }
    vec4 L2 = canopyLayer(p + vec2(25.0, 19.0), 40.0, 37.0, s, 0.0, t, -nLobe);
    if (L2.a > 0.001) {
      col *= 1.0 - 0.15 * L2.a;
      col = mix(col, L2.rgb * 1.03, L2.a);
    }
  }

  // ---------- Chim nhiệt đới ----------
  for (int i = 0; i < 8; i++) {
    if (float(i) >= uBirdN) break;
    vec4 b = uBird[i];
    vec2 d0 = p - b.xy, d1 = d0 - vec2(24.0, 36.0);
    if (dot(d1, d1) < 360.0) {
      vec3 g = birdSD(rot(-b.z) * d1, b.w);
      col = mix(col, col * 0.68, ss(1.8, -1.8, min(g.x, g.y)) * 0.32);
    }
    if (dot(d0, d0) < 360.0) {
      vec3 g = birdSD(rot(-b.z) * d0, b.w);
      vec3 wingC = mix(vec3(0.18, 0.78, 0.52), vec3(0.12, 0.45, 0.68), ss(0.35, 0.85, g.z));
      col = mix(col, wingC, ss(0.6, -0.6, g.y));
      col = mix(col, vec3(0.96, 0.82, 0.24), ss(0.6, -0.6, g.x));
      col = mix(col, vec3(0.95, 0.36, 0.22), ss(0.5, -0.5, length(rot(-b.z) * d0 - vec2(6.2, 0.0)) - 1.1));
    }
  }

  // ---------- Sương mù trôi qua rừng mưa ----------
  if (uMist > 0.01) {
    vec2 mp1 = p + vec2(-t * 14.0, sin(p.x * 0.004 + t * 0.2) * 18.0);
    vec2 mp2 = p + vec2(-t * 22.0 + 400.0, cos(p.x * 0.003 - t * 0.15) * 24.0);
    float m1 = N(mp1, 920.0).r * N(mp2, 480.0).g;
    float mistA = ss(0.22, 0.62, m1) * uMist * (0.25 + 0.35 * ss(-20.0, 90.0, s));
    col = mix(col, vec3(0.84, 0.93, 0.89), mistA);
  }

  // ---------- Đom đóm trong rừng ----------
  for (int i = 0; i < 15; i++) {
    if (float(i) >= uFlyN) break;
    vec4 fl = uFly[i];
    vec2 dp = p - fl.xy;
    float d2 = dot(dp, dp);
    if (d2 < 900.0) {
      float d = sqrt(d2);
      float pulse = 0.55 + 0.45 * sin(t * 3.2 + fl.z);
      float glow = exp(-d * 0.14) * pulse * fl.w;
      float core = (1.0 - ss(1.2, 2.8, d)) * pulse * fl.w;
      col += vec3(0.68, 0.96, 0.32) * glow * 0.55;
      col = mix(col, vec3(0.96, 1.0, 0.72), core);
    }
  }

  // ---------- Hạt mưa rơi xiên dày đặc ----------
  if (uRain > 0.01) {
    float r1 = rainStreaks(p, t, uRain, 680.0, 1.0);
    float r2 = rainStreaks(p + vec2(73.0, 41.0), t, uRain * 0.75, 520.0, 0.78);
    float rAmt = max(r1, r2 * 0.75);
    col = mix(col, vec3(0.86, 0.95, 0.92), rAmt * 0.42);
  }

  col *= 1.0 + (g2 - 0.5) * 0.03;
  if (uDebug > 0.5) col = mix(col, vec3(0.9, 0.15, 0.15), 1.0 - ss(0.0, 1.5, abs(s0)));
  o = vec4(col, 1.0);
}`;

const cv = document.getElementById('art');
const gl = cv.getContext('webgl2', { antialias: false });
if (!gl) document.getElementById('nogl').style.display = 'grid';
function program(fs) {
  const mk = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); throw new Error('shader'); }
    return s;
  };
  const p = gl.createProgram();
  gl.attachShader(p, mk(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  const U = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, ''); U[nm] = gl.getUniformLocation(p, nm); }
  return { p, U };
}
const PR = program(FS);
gl.bindVertexArray(gl.createVertexArray());

let noiseTex = null;
function buildNoiseTex() {
  const { S, d } = makeNoiseImage();
  noiseTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, noiseTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, S, S, 0, gl.RGBA, gl.UNSIGNED_BYTE, d);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
}
const f32 = new Float32Array(1), u32 = new Uint32Array(f32.buffer);
function toHalf(v) {
  f32[0] = v; const x = u32[0];
  const sign = (x >>> 16) & 0x8000, e = ((x >>> 23) & 0xff) - 112, m = x & 0x7fffff;
  if (e <= 0) return sign;
  if (e >= 31) return sign | 0x7c00;
  return sign | (e << 10) | (m >>> 13);
}
const ftex = [null, null];
let fromI = 0, toI = 0, morphT0 = -1e9, morphDur = MORPH_MS, FA = null, FB = null;
function allocField() {
  for (let i = 0; i < 2; i++) {
    if (ftex[i]) gl.deleteTexture(ftex[i]);
    ftex[i] = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, ftex[i]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, Gw, Gh, 0, gl.RED, gl.HALF_FLOAT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }
}
function uploadField(i, Fd) {
  const d = new Uint16Array(Gw * Gh);
  for (let k = 0; k < d.length; k++) d[k] = toHalf(Fd.s[k]);
  gl.bindTexture(gl.TEXTURE_2D, ftex[i]);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, Gw, Gh, gl.RED, gl.HALF_FLOAT, d);
}

let icons = [];
const iconRects = () => icons.map(ic => ({ cx: ic.x + ic.w / 2, cy: ic.y + ic.h / 2, hw: ic.w / 2 - 4, hh: ic.h / 2 - 2 }));
function commit(fromEmpty = false) {
  const nf = computeField(iconRects());
  const target = 1 - toI;
  if (fromEmpty) { FA = computeField([]); uploadField(toI, FA); }
  else FA = FB;
  FB = nf;
  uploadField(target, FB);
  fromI = toI; toI = target;
  morphT0 = performance.now();
  morphDur = fromEmpty ? 2600 : MORPH_MS;
}
function refresh() {
  FA = FB = computeField(iconRects());
  uploadField(toI, FB);
  fromI = toI; morphT0 = -1e9;
}

let curMix = 1;

/* ======================================================================
   Mô phỏng chim nhiệt đới và đom đóm
   ====================================================================== */
const birds = [], birdUniform = new Float32Array(32);
const flies = [], flyUniform = new Float32Array(60);

function spawnBird() {
  const a = Math.random() * Math.PI * 2;
  return {
    x: 80 + Math.random() * Math.max(100, W - 160),
    y: 80 + Math.random() * Math.max(100, H - TASKBAR - 160),
    a, sp: 22 + Math.random() * 14, turn: (Math.random() - 0.5) * 0.25,
    ph: Math.random() * 6.28, timer: 2 + Math.random() * 4,
  };
}
function stepBirds(dt) {
  const want = Math.max(0, Math.min(8, Math.round(P.birds)));
  while (birds.length < want) birds.push(spawnBird());
  if (birds.length > want) birds.length = want;
  for (let i = 0; i < birds.length; i++) {
    const b = birds[i];
    b.timer -= dt;
    if (b.timer <= 0) { b.turn = (Math.random() - 0.5) * 0.55; b.timer = 2.5 + Math.random() * 4; }
    const m = 110;
    if (b.x < m) b.turn += (Math.cos(b.a) < 0 ? 0.8 : 0.3) * dt;
    if (b.x > W - m) b.turn -= (Math.cos(b.a) > 0 ? 0.8 : 0.3) * dt;
    if (b.y < m) b.turn += (Math.sin(b.a) < 0 ? 0.8 : 0.3) * dt;
    if (b.y > H - TASKBAR - m) b.turn -= (Math.sin(b.a) > 0 ? 0.8 : 0.3) * dt;
    b.a += b.turn * dt;
    b.x += Math.cos(b.a) * b.sp * dt;
    b.y += Math.sin(b.a) * b.sp * dt;
    b.ph += dt * 7.5;
    birdUniform[i * 4] = b.x;
    birdUniform[i * 4 + 1] = b.y;
    birdUniform[i * 4 + 2] = b.a;
    birdUniform[i * 4 + 3] = b.ph;
  }
}

function spawnFly() {
  return {
    x: 40 + Math.random() * Math.max(100, W - 80),
    y: 40 + Math.random() * Math.max(100, H - TASKBAR - 80),
    vx: (Math.random() - 0.5) * 14,
    vy: (Math.random() - 0.5) * 14,
    ph: Math.random() * 6.28,
    alpha: 0.7 + Math.random() * 0.3,
  };
}
function stepFlies(dt) {
  const want = Math.max(0, Math.min(15, Math.round(P.fireflies)));
  while (flies.length < want) flies.push(spawnFly());
  if (flies.length > want) flies.length = want;
  for (let i = 0; i < flies.length; i++) {
    const f = flies[i];
    f.vx += (Math.random() - 0.5) * 18 * dt;
    f.vy += (Math.random() - 0.5) * 18 * dt;
    const sp = Math.hypot(f.vx, f.vy);
    if (sp > 18) { f.vx = (f.vx / sp) * 18; f.vy = (f.vy / sp) * 18; }
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    if (f.x < 20) f.vx = Math.abs(f.vx);
    if (f.x > W - 20) f.vx = -Math.abs(f.vx);
    if (f.y < 20) f.vy = Math.abs(f.vy);
    if (f.y > H - TASKBAR - 20) f.vy = -Math.abs(f.vy);
    flyUniform[i * 4] = f.x;
    flyUniform[i * 4 + 1] = f.y;
    flyUniform[i * 4 + 2] = f.ph;
    flyUniform[i * 4 + 3] = f.alpha;
  }
}

function resize() {
  W = innerWidth; H = innerHeight;
  const scale = PREVIEW ? 0.38 : Math.min(devicePixelRatio || 1, 0.72);
  const box = cv.getBoundingClientRect();
  cv.width = Math.round((box.width || W) * scale); cv.height = Math.round((box.height || H) * scale); cv._scale = scale;
  Gw = Math.ceil(W / STEP) + 2; Gh = Math.ceil(H / STEP) + 2;
  buildNoise();
  allocField();
}

const T0 = performance.now();
let lastT = 0, frameN = 0, paused = false;
function frame(now) {
  requestAnimationFrame(frame);
  if (paused) { lastT = 0; return; }
  if (P.cap30 && now - lastT < 40) return;
  const dt = lastT ? Math.min((now - lastT) / 1000, 0.1) : 0.03;
  lastT = now;
  const e = Math.min((now - morphT0) / morphDur, 1);
  curMix = e < 0.5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2;
  stepBirds(dt);
  stepFlies(dt);
  draw(now);
  frameN++;
}
function draw(now) {
  const { p, U } = PR;
  gl.useProgram(p);
  gl.viewport(0, 0, cv.width, cv.height);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, noiseTex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, ftex[fromI]);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, ftex[toI]);
  gl.uniform1i(U.uNoise, 0); gl.uniform1i(U.uFA, 1); gl.uniform1i(U.uFB, 2);
  gl.uniform2f(U.uRes, cv.width / cv._scale, cv.height / cv._scale);
  gl.uniform2f(U.uGrid, Gw, Gh);
  gl.uniform1f(U.uScale, cv._scale);
  gl.uniform1f(U.uSeed, (seed % 997) * 0.37);
  gl.uniform1f(U.uStep, STEP);
  gl.uniform1f(U.uMix, curMix);
  gl.uniform1f(U.uTime, (now - T0) / 1000);
  gl.uniform1f(U.uRain, P.rain);
  gl.uniform1f(U.uMist, P.mist);
  gl.uniform1f(U.uWind, P.wind);
  gl.uniform1f(U.uDebug, P.debug ? 1 : 0);
  gl.uniform1f(U.uBirdN, birds.length);
  if (birds.length) gl.uniform4fv(U.uBird, birdUniform);
  gl.uniform1f(U.uFlyN, flies.length);
  if (flies.length) gl.uniform4fv(U.uFly, flyUniform);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

let iconsSeen = !(WALL || PREVIEW);
function reseed(v) {
  seed = v; buildNoise();
  birds.length = 0; flies.length = 0;
  if (!iconsSeen) return;
  commit(true);
}
let resizeT = 0;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { resize(); refresh(); }, 100);
});

resize();
buildNoiseTex();
if (WALL || PREVIEW) startHostedMode();
else commit(true);
requestAnimationFrame(frame);

function applySettings(v) {
  if (typeof v.seed === 'number' && v.seed !== seed) reseed(v.seed);
  let field = false;
  for (const k in v) {
    if (!SLIDERS.some(s => s.key === k) || typeof v[k] !== typeof P[k] || P[k] === v[k]) continue;
    P[k] = v[k];
    if (k === 'sigma' || k === 'warp') field = true;
  }
  if (field && FB) refresh();
}

function drawGhosts() {
  const box = document.getElementById('ghosts');
  box.innerHTML = icons.map(ic => `<div class="ghost" style="left:${ic.x}px;top:${ic.y}px;width:${ic.w}px;height:${ic.h}px"><i></i><b></b></div>`).join('');
}

function startHostedMode() {
  document.body.classList.add('wall');
  if (PREVIEW) {
    document.body.classList.add('preview');
    const g = document.createElement('div'); g.id = 'ghosts'; document.body.appendChild(g);
  }
  icons = [];
  commit(true);
  let first = true;
  const handle = m => {
    if (m.t === 'pause') { paused = !!m.v; return; }
    if (m.t === 'settings') { applySettings(m.v || {}); return; }
    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t !== 'icons') return;
    const k = window.devicePixelRatio || 1;
    icons = m.vis ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];
    if (PREVIEW) drawGhosts();
    iconsSeen = true;
    commit(first);
    first = false;
  };
  if (PREVIEW) {
    addEventListener('message', ev => { if (ev.source === parent) handle(typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data); });
    parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
    return;
  }
  const host = window.chrome && window.chrome.webview;
  if (!host) return;
  host.addEventListener('message', ev => handle(JSON.parse(ev.data)));
  host.postMessage('ready');
}
</script>

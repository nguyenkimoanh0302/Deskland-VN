<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deskland · Sân bóng sôi động</title>
<style>
  :root { --taskbar: 48px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1c2e3b; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: pointer; }
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.preview #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(255,255,255,.88); box-shadow: 3px 6px 8px rgba(20,35,45,.32); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.78); }
</style>
</head>
<body>
<canvas id="art"></canvas>
<script>
'use strict';

const TASKBAR = 48;
const QS = new URLSearchParams(location.search);
const WALL = QS.has('wallpaper');
const PREVIEW = QS.has('preview');

const DEFAULTS = { players: 6, speed: 1.0, passFreq: 1.0, lighting: 0, stripes: 0.65 };
const P = Object.assign({}, DEFAULTS);

const cv = document.getElementById('art');
const ctx = cv.getContext('2d', { alpha: false });
let W = innerWidth, H = innerHeight, S = 1;
let seed = 2026, paused = false, lastT = 0, roamT = 0;
let icons = [], players = [];
let targetPing = null, goalFx = null;

const ball = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, drag: 2.1, owner: 0, hold: 0.9, lock: 0, shot: false };

function sRand(k) {
  let h = Math.imul(k ^ (seed * 131 + 19), 374761393);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function pitchRect() {
  const availH = Math.max(220, H - TASKBAR);
  const padX = Math.max(92 * S, W * 0.085);
  const padY = Math.max(58 * S, availH * 0.085);
  return [padX, padY, Math.max(padX + 200, W - padX), Math.max(padY + 140, availH - padY)];
}

function splitForm(n) {
  const m = Math.max(2, Math.min(10, Math.round(n) - 1));
  const map = { 2:[1,0,1], 3:[1,1,1], 4:[2,1,1], 5:[2,2,1], 6:[2,2,2], 7:[3,2,2], 8:[3,3,2], 9:[4,3,2], 10:[4,3,3] };
  return map[m] || [2,2,1];
}

function lineYs(c, sp) {
  if (!c) return [];
  if (c === 1) return [0.5];
  return Array.from({ length: c }, (_, i) => 0.5 - sp * 0.5 + sp * (i / (c - 1)));
}

function buildMatch() {
  const n = Math.max(3, Math.min(11, Math.round(P.players)));
  const [nd, nm, nf] = splitForm(n);
  const [x0, y0, x1, y1] = pitchRect();
  const pw = x1 - x0, ph = y1 - y0;
  players = [];
  let k = 1;
  for (let team = 0; team < 2; team++) {
    const slots = [['gk', 0.042, 0.5]];
    lineYs(nd, 0.62).forEach(y => slots.push(['def', 0.20, y]));
    lineYs(nm, 0.66).forEach(y => slots.push(['mid', 0.36, y]));
    lineYs(nf, 0.54).forEach(y => slots.push(['fwd', 0.47, y]));
    for (const [role, bhx, hy] of slots) {
      const hx = team === 0 ? bhx : 1 - bhx;
      players.push({
        team, role, hx, hy,
        x: x0 + hx * pw, y: y0 + hy * ph,
        vx: 0, vy: 0, dir: team === 0 ? 0 : Math.PI,
        stride: sRand(k++) * 6.28, ph: sRand(k++) * 6.28, chase: -1
      });
    }
  }
  ball.owner = Math.max(0, players.findIndex(p => p.team === 0 && p.role === 'fwd'));
  ball.x = players[ball.owner].x + 8 * S;
  ball.y = players[ball.owner].y;
  ball.vx = ball.vy = ball.z = ball.vz = 0;
  ball.hold = 0.8;
}

function kickTo(tx, ty, drag, maxV, loft) {
  const dx = tx - ball.x, dy = ty - ball.y;
  const dist = Math.max(1, Math.hypot(dx, dy));
  let v0 = dist * drag, d = drag;
  if (v0 > maxV) { v0 = maxV; d = Math.max(0.95, v0 / dist); }
  ball.vx = (dx / dist) * v0;
  ball.vy = (dy / dist) * v0;
  ball.vz = Math.min(95, dist * loft);
  ball.drag = d;
}

cv.addEventListener('pointerdown', e => {
  const [x0, y0, x1, y1] = pitchRect();
  const tx = Math.max(x0 - 22 * S, Math.min(x1 + 22 * S, e.clientX));
  const ty = Math.max(y0 - 14 * S, Math.min(y1 + 14 * S, e.clientY));
  ball.owner = -1;
  ball.lock = 0.26;
  kickTo(tx, ty, 2.3, 740 * S, 0.18);
  targetPing = { x: tx, y: ty, age: 0 };
  players.forEach(p => { p.chase = -1; });
  players.map((p, i) => ({ i, r: p.role, d: Math.hypot(p.x - tx, p.y - ty) }))
    .filter(o => o.r !== 'gk')
    .sort((a, b) => a.d - b.d)
    .slice(0, 4)
    .forEach((o, rk) => { players[o.i].chase = rk; });
});

function step(dt) {
  const [x0, y0, x1, y1] = pitchRect();
  const pw = x1 - x0, ph = y1 - y0, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const tempo = Math.max(0.35, P.speed);
  roamT += dt * tempo;
  if (targetPing) { targetPing.age += dt; if (targetPing.age > 1.7) targetPing = null; }
  if (goalFx) {
    goalFx.age += dt;
    if (goalFx.age > 2.0) { goalFx = null; ball.owner = 1; ball.x = cx; ball.y = cy; }
    return;
  }
  if (ball.lock > 0) ball.lock = Math.max(0, ball.lock - dt);

  if (ball.owner >= 0 && players[ball.owner]) {
    const p = players[ball.owner];
    const gDir = p.team === 0 ? 1 : -1;
    p.vx = gDir * 68 * S * tempo;
    p.vy = Math.sin(roamT * 2 + p.ph) * 38 * S * tempo;
    p.x = Math.max(x0 + 14 * S, Math.min(x1 - 14 * S, p.x + p.vx * dt));
    p.y = Math.max(y0 + 14 * S, Math.min(y1 - 14 * S, p.y + p.vy * dt));
    p.dir = Math.atan2(p.vy, p.vx);
    p.stride += (Math.hypot(p.vx, p.vy) / (12 * S)) * dt;
    ball.x = p.x + Math.cos(p.dir) * 8 * S;
    ball.y = p.y + Math.sin(p.dir) * 8 * S;
    ball.hold -= dt * P.passFreq;
    if (ball.hold <= 0) {
      const mates = players.map((m, idx) => ({ m, idx })).filter(o => o.idx !== ball.owner && o.m.team === p.team && o.m.role !== 'gk');
      if (mates.length) {
        const pick = mates[Math.floor(Math.random() * mates.length)].m;
        ball.owner = -1;
        ball.lock = 0.24;
        kickTo(pick.x + pick.vx * 0.22, pick.y + pick.vy * 0.22, 2.0, 540 * S * Math.sqrt(tempo), 0.10);
      } else {
        ball.hold = 0.6;
      }
    }
  } else {
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    const damp = Math.exp(-ball.drag * dt);
    ball.vx *= damp; ball.vy *= damp;
    if (ball.z > 0 || ball.vz !== 0) {
      ball.z += ball.vz * dt; ball.vz -= 290 * dt;
      if (ball.z <= 0) { ball.z = 0; ball.vz = ball.vz < -20 ? -ball.vz * 0.4 : 0; }
    }
    const gh = ph * 0.22;
    if (Math.abs(ball.y - cy) < gh * 0.48 && (ball.x < x0 - 3 * S || ball.x > x1 + 3 * S)) {
      goalFx = { x: ball.x < cx ? x0 : x1, y: ball.y, age: 0 };
      return;
    }
    ball.x = Math.max(x0 - 20 * S, Math.min(x1 + 20 * S, ball.x));
    ball.y = Math.max(y0 - 16 * S, Math.min(y1 + 16 * S, ball.y));
  }

  const bnx = (ball.x - x0) / Math.max(1, pw), bny = (ball.y - y0) / Math.max(1, ph);
  players.forEach((p, i) => {
    if (i === ball.owner) return;
    let tx, ty, mul = 0.9;
    if (p.role === 'gk') {
      tx = p.team === 0 ? x0 + 16 * S : x1 - 16 * S;
      ty = cy + Math.max(-ph * 0.1, Math.min(ph * 0.1, ball.y - cy));
      mul = 1.1;
    } else if (p.chase >= 0) {
      const ang = p.chase * 1.9;
      tx = ball.x + (p.chase ? Math.cos(ang) * 16 * S : 0);
      ty = ball.y + (p.chase ? Math.sin(ang) * 14 * S : 0);
      mul = 1.45;
    } else {
      tx = x0 + Math.max(0.08, Math.min(0.92, p.hx + (bnx - 0.5) * 0.34)) * pw + Math.cos(roamT + p.ph) * 16 * S;
      ty = y0 + Math.max(0.08, Math.min(0.92, p.hy + (bny - 0.5) * 0.22)) * ph + Math.sin(roamT * 1.3 + p.ph) * 14 * S;
    }
    const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
    if (d > 2 * S) {
      const sp = Math.min(115 * S * tempo * mul, d * 4);
      p.vx = (dx / d) * sp; p.vy = (dy / d) * sp;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.dir = Math.atan2(p.vy, p.vx);
      p.stride += (sp / (12 * S)) * dt;
    }
    if (ball.owner < 0 && ball.lock <= 0 && ball.z < 16 && Math.hypot(p.x - ball.x, p.y - ball.y) < 14 * S) {
      ball.owner = i;
      ball.hold = (0.65 + Math.random() * 0.65) / Math.max(0.4, P.passFreq);
      players.forEach(q => { q.chase = -1; });
    }
  });
}

function draw() {
  const [x0, y0, x1, y1] = pitchRect();
  const pw = x1 - x0, ph = y1 - y0, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const night = P.lighting >= 2, sunset = P.lighting === 1;

  ctx.fillStyle = night ? '#151c25' : sunset ? '#2c2930' : '#27343e';
  ctx.fillRect(0, 0, W, H);

  // Đường piste đất nung
  ctx.fillStyle = night ? '#7a382e' : '#c05b43';
  ctx.beginPath();
  ctx.roundRect(x0 - 72 * S, y0 - 46 * S, pw + 144 * S, ph + 92 * S, 42 * S);
  ctx.fill();

  // Thảm cỏ biên & 14 sọc cỏ
  const gA = night ? '#257e3c' : sunset ? '#449539' : '#399e44';
  const gB = night ? '#309247' : sunset ? '#58aa41' : '#47b14e';
  ctx.fillStyle = gA;
  ctx.beginPath();
  ctx.roundRect(x0 - 26 * S, y0 - 22 * S, pw + 52 * S, ph + 44 * S, 10 * S);
  ctx.fill();

  const sw = pw / 14;
  for (let i = 0; i < 14; i++) {
    ctx.fillStyle = i % 2 === 0 ? gA : gB;
    ctx.globalAlpha = i % 2 === 0 ? 1 : P.stripes;
    ctx.fillRect(x0 + i * sw, y0, sw + 0.5, ph);
  }
  ctx.globalAlpha = 1;

  // Vạch vôi trắng
  ctx.strokeStyle = 'rgba(248,252,250,0.9)';
  ctx.lineWidth = Math.max(1.4, 2.1 * S);
  ctx.strokeRect(x0, y0, pw, ph);
  ctx.beginPath();
  ctx.moveTo(cx, y0); ctx.lineTo(cx, y1);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, ph * 0.165, 0, Math.PI * 2);
  ctx.stroke();
  const penW = pw * 0.155, penH = ph * 0.54, gaW = pw * 0.055, gaH = ph * 0.28;
  ctx.strokeRect(x0, cy - penH / 2, penW, penH);
  ctx.strokeRect(x1 - penW, cy - penH / 2, penW, penH);
  ctx.strokeRect(x0, cy - gaH / 2, gaW, gaH);
  ctx.strokeRect(x1 - gaW, cy - gaH / 2, gaW, gaH);

  // Vòng sáng mục tiêu Click
  if (targetPing) {
    const a = Math.max(0, 1 - targetPing.age / 1.7);
    ctx.strokeStyle = `rgba(255,244,140,${a * 0.85})`;
    ctx.lineWidth = 2 * S;
    ctx.beginPath();
    ctx.arc(targetPing.x, targetPing.y, (8 + targetPing.age * 26) * S, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Cầu thủ
  for (const p of players) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.ellipse(2.5 * S, 3 * S, 6 * S, 5 * S, 0, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(p.dir);
    ctx.fillStyle = p.role === 'gk' ? (p.team === 0 ? '#ffb814' : '#0dc7a3') : (p.team === 0 ? '#e53935' : '#1e88e5');
    ctx.strokeStyle = '#1c241e';
    ctx.lineWidth = 1.2 * S;
    ctx.beginPath(); ctx.roundRect(-4.2 * S, -6.8 * S, 8.4 * S, 13.6 * S, 3.4 * S); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2d2018';
    ctx.beginPath(); ctx.arc(0.8 * S, 0, 3.9 * S, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Bóng
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.beginPath(); ctx.arc(ball.x + 2 * S, ball.y + 2 * S, 5.2 * S, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#1d2228';
  ctx.lineWidth = 1.2 * S;
  ctx.beginPath(); ctx.arc(ball.x, ball.y - ball.z * 0.5 * S, 5.8 * S, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  // Hai khung thành
  const gh = ph * 0.22, gd = 26 * S;
  ctx.fillStyle = 'rgba(240,248,255,0.26)';
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2.4 * S;
  ctx.fillRect(x0 - gd, cy - gh / 2, gd, gh);
  ctx.strokeRect(x0 - gd, cy - gh / 2, gd, gh);
  ctx.fillRect(x1, cy - gh / 2, gd, gh);
  ctx.strokeRect(x1, cy - gh / 2, gd, gh);
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  S = Math.max(0.45, Math.min(W, H) / 900);
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildMatch();
}

function frame(now) {
  requestAnimationFrame(frame);
  if (paused) { lastT = 0; return; }
  const dt = lastT ? Math.min((now - lastT) / 1000, 0.06) : 0.03;
  lastT = now;
  step(dt);
  draw();
}

function applySettings(v) {
  let rebuild = false;
  if (typeof v.seed === 'number' && v.seed !== seed) { seed = v.seed; rebuild = true; }
  for (const k of Object.keys(DEFAULTS)) {
    if (typeof v[k] === 'number' && P[k] !== v[k]) {
      P[k] = v[k];
      if (k === 'players') rebuild = true;
    }
  }
  if (rebuild) buildMatch();
}

function drawGhosts() {
  const box = document.getElementById('ghosts');
  if (!box) return;
  box.innerHTML = icons.map(ic => `<div class="ghost" style="left:${ic.x}px;top:${ic.y}px;width:${ic.w}px;height:${ic.h}px"><i></i><b></b></div>`).join('');
}

if (WALL || PREVIEW) {
  if (PREVIEW) {
    document.body.classList.add('preview');
    const g = document.createElement('div'); g.id = 'ghosts'; document.body.appendChild(g);
  }
  const handle = m => {
    if (m.t === 'pause') { paused = !!m.v; return; }
    if (m.t === 'settings') { applySettings(m.v || {}); return; }
    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t === 'icons') {
      const k = window.devicePixelRatio || 1;
      icons = m.vis ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];
      if (PREVIEW) drawGhosts();
    }
  };
  if (PREVIEW) {
    addEventListener('message', ev => { if (ev.source === parent) handle(typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data); });
    parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
  }
}

addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
